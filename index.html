:root{
  --paper:#f7f7f7;        /* mismo fondo de los logos */
  --white:#fff;
  --ink:#13271c;
  --muted:#56665c;
  --rule:#cdd8d1;
  --usb:#0a7d38;
  --usb-d:#075a29;
  --deep:#0b3a22;
  --tint:#e9f1ec;
  --tint2:#e3f3f6;
  --mint:#2fe08f;
  --cyan-d:#0b7a90;
  --amber:#8a5a00;
  --amber-bg:#fbf1d8;
  --warn:#a23b2a;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sbw:272px;
  --r:4px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17.5px/1.72 var(--serif);font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
a{color:var(--usb-d)}
img{max-width:100%}
:focus-visible{outline:3px solid var(--cyan-d);outline-offset:2px}
h1:focus,h1:focus-visible{outline:none}
.skip{position:absolute;left:-999px;top:8px;background:var(--deep);color:#fff;padding:10px 16px;z-index:100;font-family:var(--sans)}
.skip:focus{left:8px}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:var(--sbw) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--white);border-right:1px solid var(--rule);display:flex;flex-direction:column;font-family:var(--sans)}
.sb-head{padding:22px 22px 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
.sb-head img{display:block;width:100%;height:auto}
.sb-ova{display:flex;align-items:center;gap:12px;margin-top:16px}
.sb-ova img{width:40px;height:40px;border-radius:50%;flex:none}
.sb-ova b{display:block;font:700 15px/1.2 var(--sans);color:var(--deep)}
.sb-ova span{font-size:13px;color:var(--muted)}
.nav{list-style:none;margin:0;padding:10px 0 8px;flex:1}
.nav .sec{padding:16px 22px 4px;font:600 13px/1.2 var(--sans);color:var(--muted)}
.nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;width:100%;padding:8px 22px 8px 19px;border-left:3px solid transparent;cursor:pointer;font:500 15px/1.35 var(--sans);color:var(--ink)}
.nav button:hover{background:var(--tint)}
.nav button:focus-visible{outline:3px solid var(--cyan-d);outline-offset:-3px}
.nav .n{flex:none;width:1.5em;font-variant-numeric:tabular-nums;color:var(--muted)}
.nav .seen .n{color:var(--usb);font-weight:700}
.nav .cur{border-left-color:var(--usb);background:var(--tint);font-weight:700;color:var(--deep)}
.nav .cur .n{color:var(--usb-d)}
.sb-foot{padding:14px 22px 20px;border-top:1px solid var(--rule);font:400 13px var(--sans);color:var(--muted)}
.bar{height:4px;background:var(--rule);margin:0 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--usb);transition:width .4s}

.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 32px;background:var(--paper);border-bottom:1px solid var(--rule);font-family:var(--sans)}
.topbar .crumb{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb b{color:var(--deep)}
.menu-btn{all:unset;display:none;cursor:pointer;padding:7px 12px;border:1px solid var(--rule);background:#fff;font:600 14px var(--sans)}
.topbar img{width:30px;height:30px;border-radius:50%}
.content{padding:44px 32px 72px;max-width:1000px;margin:0 auto}
.page{display:none}
.page.on{display:block}

/* ---------- texto ---------- */
.kicker{display:block;font:500 14px/1.3 var(--sans);color:var(--muted);margin-bottom:6px}
h1.page-title{font:800 clamp(34px,4.6vw,52px)/1.04 var(--sans);letter-spacing:-.02em;margin:0 0 .45em;color:var(--deep);font-stretch:96%}
h2{font:700 27px/1.2 var(--sans);letter-spacing:-.01em;margin:2.4em 0 .5em;color:var(--deep);display:flex;gap:.7em;align-items:baseline;padding-top:.9em;border-top:2px solid var(--deep)}
h2 .sn{font:600 .72em var(--sans);color:var(--usb);font-variant-numeric:tabular-nums;min-width:2.3em;background:none;padding:0}
h3{font:700 19px/1.3 var(--sans);margin:1.9em 0 .35em;color:var(--deep)}
p{margin:.8em 0}
.page>p,.page>ul,.page>ol,.page>h3,.page>.callout,.page>.key,.page>.cap-title,.page>.src,.page>.objective,.page>details{max-width:40rem}
.page>h2{max-width:none}
.lead{font-size:21px;line-height:1.6;max-width:38rem;color:#24382c}
ul,ol{padding-left:1.2em}
li{margin:.35em 0}
li::marker{color:var(--usb)}
code{font:.82em var(--mono);background:var(--tint);padding:.12em .38em;border-radius:3px;color:var(--deep)}
strong{font-weight:700;color:var(--deep)}
.src{font:400 13.5px/1.5 var(--sans);color:var(--muted);margin-top:6px}
.src b{color:var(--usb-d)}

.objective{display:block;border-left:4px solid var(--deep);padding:2px 0 2px 18px;margin:26px 0 6px}
.objective svg{display:none}
.objective b{display:block;font:700 15px var(--sans);color:var(--deep);margin-bottom:2px}
.objective p{margin:0}

/* tarjetas planas */
.card{background:var(--white);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px}
.card h3:first-child,.card h4:first-child{margin-top:0}
.grid2,.grid3,.grid4{display:grid;gap:22px 32px;margin:20px 0}
.grid2{grid-template-columns:repeat(2,1fr)}
.grid3{grid-template-columns:repeat(3,1fr)}
.grid4{grid-template-columns:repeat(4,1fr)}
.card.mini{background:none;border:0;border-top:2px solid var(--deep);border-radius:0;padding:10px 0 0}
.card.mini h4{margin:0 0 4px;font:700 17px/1.3 var(--sans);color:var(--deep)}
.card.mini p{margin:0;font-size:15.5px;line-height:1.6}
.ico{display:none}

/* avisos */
.callout{display:block;border-left:3px solid var(--usb);padding:2px 0 2px 16px;margin:1.6em 0}
.callout .t{display:block;font:700 14.5px var(--sans);color:var(--usb-d);margin-bottom:1px}
.callout p{margin:0}
.callout.dato{border-left-color:var(--cyan-d)}
.callout.dato .t{color:var(--cyan-d)}
.callout.ojo{border-left-color:#b8821f}
.callout.ojo .t{color:var(--amber)}

/* tablas */
.tw{overflow-x:auto;margin:22px 0;border:1px solid var(--rule);background:var(--white);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font:400 15.5px/1.55 var(--sans);min-width:560px}
th,td{padding:11px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
thead th{background:var(--deep);color:#fff;font-weight:600;font-size:14.5px}
thead th small{font-weight:400;opacity:.85}
tbody tr:last-child>*{border-bottom:0}
tbody th{background:var(--tint);color:var(--deep);font-weight:700;white-space:nowrap}

/* pestañas */
.tabs{margin:22px 0}
.tablist{display:flex;gap:0;flex-wrap:wrap;border-bottom:2px solid var(--deep);font-family:var(--sans)}
.tablist button{all:unset;cursor:pointer;padding:10px 18px;font:600 15px var(--sans);color:var(--muted);border:1px solid transparent;border-bottom:0;margin-bottom:-2px}
.tablist button[aria-selected=true]{background:var(--white);color:var(--deep);border-color:var(--deep);border-bottom:2px solid var(--white)}
.tablist button:hover{color:var(--deep)}
.tablist button:focus-visible{outline:3px solid var(--cyan-d);outline-offset:-3px}
.tabpanel{background:var(--white);border:1px solid var(--rule);border-top:0;padding:22px 24px}
.tabpanel[hidden]{display:none}
.tabpanel>*:first-child{margin-top:0}

/* acordeón */
details.acc{border-top:1px solid var(--rule);margin:0}
details.acc:last-of-type{border-bottom:1px solid var(--rule)}
details.acc summary{cursor:pointer;list-style:none;padding:14px 4px;font:600 16.5px var(--sans);color:var(--deep);display:flex;justify-content:space-between;gap:12px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-weight:400;font-size:22px;line-height:1;color:var(--usb)}
details.acc[open] summary::after{content:"–"}
details.acc .body{padding:0 4px 16px}

/* código */
pre.code{margin:18px 0;background:#10251a;color:#d8f0e2;border-radius:var(--r);padding:16px 20px;overflow:auto;font:13.5px/1.65 var(--mono)}
pre.code .c{color:#86b79b}
pre.code .k{color:#7ee7b2}
pre.code .s{color:#ffd98a}
pre.code .f{color:#7fdcf0}
pre.code .ln{display:block;padding:0 8px;margin:0 -8px}
pre.code .ln.hl{background:rgba(47,224,143,.16);box-shadow:inset 3px 0 0 var(--mint)}
.cap-title{font:700 15px var(--sans);color:var(--deep);margin:26px 0 6px}

/* ---------- figuras interactivas ---------- */
.fig{margin:28px 0;background:var(--white);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.fig-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:11px 18px;border-bottom:2px solid var(--deep);font-family:var(--sans)}
.fig-head b{font:700 16px/1.3 var(--sans);color:var(--deep)}
.fig-head span{font-size:13px;color:var(--muted);white-space:nowrap}
.stage{padding:14px 10px 6px;overflow-x:auto}
.stage svg{display:block;width:100%;height:auto;min-width:560px}
.stepbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px 4px;font-family:var(--sans)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 16px;border-radius:var(--r);background:var(--usb);color:#fff;font:600 14.5px/1 var(--sans);display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--usb-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--white);color:var(--deep);border:1px solid var(--deep)}
.btn.ghost:hover{background:var(--tint)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.38;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--cyan-d);outline-offset:2px}
.dots{display:flex;gap:6px;flex:1;min-width:120px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border:2px solid var(--usb);background:#fff;cursor:pointer}
.dots i.done{background:var(--usb)}
.dots i.now{background:var(--deep);border-color:var(--deep);transform:scale(1.25)}
.count{font:500 13.5px var(--sans);color:var(--muted);min-width:88px;text-align:right}
.caption{margin:10px 0 0;padding:12px 18px 18px;font:400 16.5px/1.6 var(--serif);min-height:5.2em;border-top:1px solid var(--rule)}
.caption b{font-family:var(--sans);color:var(--usb-d)}
.hint{padding:0 18px 4px;font:400 13.5px var(--sans);color:var(--muted);margin:0}

svg text{font-family:var(--sans)}
.nd rect,.nd circle{fill:#fff;stroke:#8fa99a;stroke-width:2;transition:all .3s}
.nd text{font-size:14px;font-weight:700;fill:#27382d;text-anchor:middle;pointer-events:none}
.nd.on rect,.nd.on circle{fill:var(--deep);stroke:var(--deep);stroke-width:3}
.nd.on text{fill:#fff}
.nd.past rect,.nd.past circle{fill:var(--tint);stroke:var(--usb)}
.nd{cursor:pointer}
.ed path,.ed line{fill:none;stroke:#8fa99a;stroke-width:2.2;transition:stroke .3s,stroke-width .3s}
.ed text{font-size:12px;fill:var(--muted)}
.ed.on path,.ed.on line{stroke:var(--usb);stroke-width:4}
.ed.on text{fill:var(--deep);font-weight:700}
.ed path.live{stroke-dasharray:9 7;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.tok circle{stroke:#fff;stroke-width:2}
.tok text{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.tok{transition:transform .8s cubic-bezier(.5,.1,.2,1)}
.qbox{fill:#fff;stroke:#8fa99a;stroke-width:2}
.qbox.hl{stroke:var(--usb);stroke-width:3;fill:#f1f8f4}
.slot{fill:none;stroke:#c6d3cb;stroke-width:1.5;stroke-dasharray:3 3}
.lab{font-size:13px;font-weight:700;fill:var(--deep)}
.lab2{font-size:12px;fill:var(--muted)}

/* diagramas de secuencia */
.sq .life{stroke:#b4c6bb;stroke-width:1.5;stroke-dasharray:5 5}
.sq .actor rect{fill:var(--deep);rx:3}
.sq .actor text{fill:#fff;font-size:14px;font-weight:700;text-anchor:middle}
.sq .actor text.sub{font-size:11.5px;font-weight:400;fill:#c3e5d2}
.sq .stp{opacity:0;transition:opacity .4s;pointer-events:none}
.sq .stp.show{opacity:1}
.sq .stp .ln{stroke:#6f8f7c;stroke-width:2}
.sq .stp .hd{fill:#6f8f7c}
.sq .stp text{font-size:12.5px;fill:#33463a;text-anchor:middle}
.sq .stp .nb{fill:#fff;stroke:#a3bdad;stroke-width:1.6}
.sq .stp.ok .nb{fill:var(--tint);stroke:var(--usb)}
.sq .stp.kn .nb{fill:var(--tint2);stroke:var(--cyan-d)}
.sq .stp.wt .nb{fill:var(--amber-bg);stroke:#c99a3c}
.sq .stp.cur .ln{stroke:var(--usb);stroke-width:3.4}
.sq .stp.cur .hd{fill:var(--usb)}
.sq .stp.cur text{fill:var(--deep);font-weight:700}
.sq .stp.cur .nb{stroke-width:3}
.sq .num{fill:#8da597;font-size:11px;font-weight:700;text-anchor:middle}
.sq .stp.cur .num{fill:var(--usb)}

/* memoria / PCB / árbol */
.memwrap{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:32px;align-items:start;margin:22px 0}
.mem{display:flex;flex-direction:column;border:2px solid var(--deep);background:#fff;font-family:var(--sans)}
.mem button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px;font:700 15.5px var(--sans);color:var(--deep);border-bottom:2px solid var(--deep)}
.mem button:last-child{border-bottom:0}
.mem button small{font-weight:400;color:var(--muted);font-size:13px}
.mem button:hover{background:var(--tint)}
.mem button[aria-pressed=true]{background:var(--deep);color:#fff}
.mem button[aria-pressed=true] small{color:#c3e5d2}
.mem .free{padding:9px 16px;text-align:center;font-size:13px;color:var(--muted);background:repeating-linear-gradient(45deg,#eef3f0 0 8px,#fff 8px 16px);border-bottom:2px solid var(--deep)}
.mem button:focus-visible{outline:3px solid var(--cyan-d);outline-offset:-3px}
.addr{display:flex;justify-content:space-between;font:500 12.5px var(--sans);color:var(--muted);margin:6px 2px 0}
.detail{border-left:3px solid var(--usb);padding:2px 0 2px 22px}
.detail h4{margin:0 0 6px;font:700 22px/1.25 var(--sans);color:var(--deep)}
.detail .tagline{display:block;font:600 14px var(--sans);color:var(--cyan-d);margin-bottom:2px}
.detail ul{margin:.4em 0}
.pcb{display:grid;border:2px solid var(--deep);background:#fff;font-family:var(--sans)}
.pcb button{all:unset;cursor:pointer;padding:12px 16px;font:600 15px var(--sans);color:var(--deep);border-bottom:2px solid var(--deep);display:flex;gap:12px;align-items:baseline}
.pcb button:last-child{border-bottom:0}
.pcb button:hover{background:var(--tint)}
.pcb button[aria-pressed=true]{background:var(--deep);color:#fff}
.pcb button i{font:500 12px var(--mono);font-style:normal;opacity:.6}
.pcb button:focus-visible{outline:3px solid var(--cyan-d);outline-offset:-3px}

.tree,.tree ul{list-style:none;margin:0;padding-left:26px;position:relative}
.tree{padding-left:0}
.tree ul::before{content:"";position:absolute;left:10px;top:0;bottom:16px;border-left:2px solid #b4c6bb}
.tree li{position:relative;margin:7px 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:18px;width:16px;border-top:2px solid #b4c6bb}
.tree button{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline;padding:6px 12px;border:1.5px solid #9fb6a8;background:#fff;font:500 13.5px var(--mono);color:var(--deep)}
.tree button b{font-weight:500;color:var(--cyan-d);font-size:12px}
.tree button:hover{border-color:var(--usb);background:var(--tint)}
.tree button[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.tree button[aria-pressed=true] b{color:var(--mint)}
.tree button:focus-visible{outline:3px solid var(--cyan-d);outline-offset:2px}
.treewrap{display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:32px;margin:22px 0;align-items:start}

/* búfer */
.ring-stat{display:flex;gap:8px;flex-wrap:wrap;padding:6px 18px 0}
.chip{font:500 13px var(--mono);padding:6px 10px;background:var(--tint);color:var(--deep);border:1px solid #bcd6c7}
.chip.warn{background:var(--amber-bg);border-color:#e3c37a;color:var(--amber)}
.cell rect{fill:#fff;stroke:#8fa99a;stroke-width:2;transition:all .3s}
.cell.full rect{fill:var(--tint);stroke:var(--usb)}
.cell text.v{font:700 20px var(--sans);fill:var(--deep);text-anchor:middle}
.cell text.i{font:500 11px var(--mono);fill:var(--muted);text-anchor:middle}
.ptr{transition:transform .5s cubic-bezier(.5,.1,.2,1)}
.ptr text{font:700 13px var(--mono);text-anchor:middle}

/* línea de tiempo */
.tl{position:relative;margin:28px 0 10px;padding:0;list-style:none;max-width:44rem}
.tl::before{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:2px;background:var(--deep)}
.tl li{position:relative;padding-left:58px;margin:0 0 6px}
.tl .dot{position:absolute;left:6px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:2px solid var(--deep);display:grid;place-items:center;font:700 12px var(--sans);color:var(--deep);z-index:1}
.tl .box{border-bottom:1px solid var(--rule)}
.tl .box>button{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;padding:12px 0}
.tl .box>button:focus-visible{outline:3px solid var(--cyan-d);outline-offset:2px}
.tl h4{margin:0;font:700 17.5px/1.3 var(--sans);color:var(--deep);display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.tl h4 em{font:500 14px var(--sans);font-style:normal;color:var(--cyan-d);white-space:nowrap}
.tl .more{display:none;padding:0 0 14px;margin:0;font-size:16.5px}
.tl li.open .more{display:block}
.tl li.open .dot{background:var(--deep);color:#fff}
.tl .more a{font:600 15px var(--sans)}

/* glosario */
.search{display:flex;margin:18px 0 10px;max-width:40rem}
.search input{flex:1;font:400 17px var(--sans);padding:12px 14px;border:2px solid var(--deep);background:#fff;border-radius:var(--r)}
.search input:focus{outline:3px solid var(--cyan-d);outline-offset:2px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 14px}
.az button{all:unset;cursor:pointer;min-width:30px;text-align:center;padding:5px 8px;border:1px solid var(--rule);background:#fff;font:600 14px var(--sans);color:var(--deep)}
.az button:hover{background:var(--tint)}
.az button[aria-pressed=true]{background:var(--deep);color:#fff;border-color:var(--deep)}
.az button:focus-visible{outline:3px solid var(--cyan-d)}
.gl{display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px}
.gl .term{padding:14px 0;border-top:1px solid var(--rule)}
.gl .term h4{margin:0 0 2px;font:700 17px/1.3 var(--sans);color:var(--deep)}
.gl .term p{margin:0;font-size:15.5px;line-height:1.6}
.gl .term .m{font:600 13.5px var(--sans)}
.empty{padding:22px;color:var(--muted);border:1px dashed var(--rule);font-family:var(--sans)}

/* navegación inferior */
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:56px;padding-top:20px;border-top:2px solid var(--deep)}
.pager .btn{padding:13px 20px;font-size:15.5px}
.key{border-top:2px solid var(--deep);margin:40px 0 0;padding:14px 0 0;max-width:40rem}
.key h3{margin:0 0 4px;font:700 18px var(--sans);color:var(--deep)}
.key ul{margin:.3em 0 0}

/* ---------- pie de página ---------- */
.foot{display:flex;align-items:center;gap:28px;padding:32px 40px;background:var(--deep);color:#fff;font-family:var(--sans)}
.foot img{width:min(300px,42%);height:auto;background:var(--paper);padding:12px 16px;flex:none}
.foot-t p{margin:0;font:400 15.5px/1.6 var(--sans);color:#cfe9da}
.foot-t p.f1{font:700 19px/1.4 var(--sans);color:#fff}
@media (max-width:640px){.foot{flex-direction:column;align-items:flex-start;padding:26px 18px}.foot img{width:min(280px,100%)}}

/* ---------- portada ---------- */
.cover{margin:-44px -32px 0}
.cv-top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 40px;background:var(--paper)}
.cv-top img.u{width:min(420px,60%);height:auto}
.cv-top img.o{width:92px;height:92px;border-radius:50%}
.cv-main{background:var(--deep);color:#fff;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:end;padding:64px 40px 56px}
.cv-main h1{font:800 clamp(56px,9.5vw,116px)/.92 var(--sans);letter-spacing:-.035em;margin:0 0 .22em;font-stretch:92%}
.cv-main .sub{font:italic 400 21px/1.5 var(--serif);color:#cfe9da;max-width:27rem;margin:0}
.cv-main .go{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px}
.cv-main .btn{background:var(--mint);color:var(--deep);padding:14px 22px;font-size:16px}
.cv-main .btn:hover{background:#6af0b2}
.cv-main .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.cv-main .btn.ghost:hover{background:rgba(255,255,255,.1)}
.ptable{font:500 14.5px/1 var(--mono);border:1px solid rgba(255,255,255,.35)}
.ptable .th,.ptable .tr{display:grid;grid-template-columns:64px 1fr 130px;gap:12px;padding:12px 14px;align-items:center}
.ptable .th{color:#9cc7ae;border-bottom:1px solid rgba(255,255,255,.35);font-size:13px}
.ptable .tr{border-bottom:1px solid rgba(255,255,255,.14)}
.ptable .tr:last-of-type{border-bottom:0}
.ptable .st{padding:5px 8px;text-align:center;border:1px solid rgba(255,255,255,.3);color:#cfe9da;transition:background .5s,color .5s,border-color .5s}
.ptable .st.e{background:var(--mint);color:var(--deep);border-color:var(--mint);font-weight:700}
.ptable .st.w{color:#ffd98a;border-color:#ffd98a}
.ptable .cap{font:400 13.5px/1.5 var(--sans);color:#b6d7c5;padding:12px 14px;border-top:1px solid rgba(255,255,255,.35)}
.cv-data{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 36px;padding:28px 40px 8px;background:var(--paper);margin:0;font-family:var(--sans)}
.cv-data div{padding:12px 0;border-bottom:1px solid var(--rule)}
.cv-data dt{font:500 13.5px var(--sans);color:var(--muted);margin-bottom:2px}
.cv-data dd{margin:0;font:700 18px/1.3 var(--sans);color:var(--deep)}
.cv-body{padding:0 40px}

/* figuras sueltas */
button.lnk{all:unset;box-sizing:border-box;cursor:pointer;display:block;border-top:2px solid var(--deep);padding:10px 0 4px}
button.lnk:hover h4{color:var(--usb);text-decoration:underline}
button.lnk:focus-visible{outline:3px solid var(--cyan-d);outline-offset:2px}
.twop{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:12px 18px 12px}
.twop .prog{grid-column:1/-1;text-align:center;background:var(--tint);border:1.5px dashed var(--usb);padding:10px;font:700 15px var(--sans);color:var(--deep)}
.twop .prog small{display:block;font-weight:400;color:var(--muted)}
.twop .pr{border:2px solid var(--deep);background:#fff;font-family:var(--sans)}
.twop .pr h5{margin:0;padding:8px 12px;background:var(--deep);color:#fff;font:700 14px var(--sans)}
.twop .pr div{padding:8px 12px;border-bottom:1px solid var(--rule);font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.twop .pr div:last-child{border-bottom:0}
.twop .pr .same{background:var(--tint)}
.twop .pr .diff{background:var(--tint2)}
.twop .pr em{font-style:normal;font-size:13px;color:var(--muted)}
.bursts{padding:10px 18px 4px;font-family:var(--sans)}
.bursts .row{margin:10px 0 16px}
.bursts .row b{display:block;margin-bottom:6px;color:var(--deep);font-size:15px}
.bursts .bar2{display:flex;height:30px;border:1px solid var(--rule)}
.bursts .bar2 i{display:block;height:100%}
.bursts .cpu{background:var(--usb)}
.bursts .io{background:repeating-linear-gradient(45deg,#d6e1db 0 6px,#e8efeb 6px 12px)}

/* ---------- adaptable ---------- */
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:50;transform:translateX(-102%);transition:transform .25s}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(11,58,34,.5)}
  .menu-btn{display:inline-block}
  .topbar{padding:10px 16px}
  .content{padding:30px 18px 56px}
  .cover{margin:-30px -18px 0}
  .grid3,.grid4{grid-template-columns:repeat(2,1fr)}
  .memwrap,.treewrap,.cv-main{grid-template-columns:1fr}
  .cv-top,.cv-main,.cv-data,.cv-body{padding-left:22px;padding-right:22px}
}
@media (max-width:640px){
  body{font-size:17px}
  .grid2,.grid3,.grid4,.gl{grid-template-columns:1fr}
  .pager{flex-direction:column-reverse}
  .pager .btn{justify-content:center}
  .cv-top img.o{width:60px;height:60px}
  h2{font-size:23px;flex-wrap:wrap}
  .twop{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.stepbar,.pager{display:none!important}
  .app{display:block}
  .page{display:block!important;page-break-after:always}
  body{background:#fff}
}

/* selector de idioma */
.lang{display:flex;border:1px solid var(--deep);border-radius:var(--r);overflow:hidden;flex:none}
.lang button{all:unset;cursor:pointer;padding:6px 12px;font:700 13.5px/1 var(--sans);color:var(--deep);background:#fff;letter-spacing:.02em}
.lang button+button{border-left:1px solid var(--deep)}

<section class="page" id="p1" data-title="Presentación y guía de uso" data-short="Presentación">
  <span class="kicker">Módulo 1</span>
  <h1 class="page-title">Presentación y guía de uso</h1>
  <p class="lead">Este OVA reúne, de forma visual e interactiva, lo que el libro de Silberschatz, Galvin y Gagne explica sobre <strong>procesos</strong>: la idea central sobre la que se construye todo sistema operativo moderno.</p>

  <div class="objective">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2fe08f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="#2fe08f"/></svg>
    <div><b>Objetivos del capítulo</b>
      <p>Presentar el concepto de proceso (un programa en ejecución), describir los mecanismos asociados —planificación, creación, finalización y comunicación— y describir cómo se comunican los procesos en los sistemas cliente-servidor.</p>
    </div>
  </div>

  <h2>Mapa de contenidos</h2>
  <p>El recorrido sigue el orden del capítulo. Puedes avanzar en secuencia o saltar a cualquier módulo desde el menú.</p>
  <div class="grid3">
    <button class="card mini lnk" data-go="2"><div class="ico">2</div><h4>El proceso</h4><p>Qué es, cómo se organiza en memoria y en qué se diferencia de un programa.</p></button>
    <button class="card mini lnk" data-go="3"><div class="ico">3</div><h4>Estados y PCB</h4><p>Los cinco estados de un proceso y el bloque donde el sistema guarda su información.</p></button>
    <button class="card mini lnk" data-go="4"><div class="ico">4</div><h4>Planificación</h4><p>Colas, planificadores a largo, medio y corto plazo, y cambio de contexto.</p></button>
    <button class="card mini lnk" data-go="5"><div class="ico">5</div><h4>Operaciones</h4><p>Creación y terminación de procesos: árbol de procesos, <code>fork()</code> y <code>CreateProcess()</code>.</p></button>
    <button class="card mini lnk" data-go="6"><div class="ico c">6</div><h4>Comunicación interprocesos</h4><p>Memoria compartida y paso de mensajes; el problema productor-consumidor.</p></button>
    <button class="card mini lnk" data-go="7"><div class="ico c">7</div><h4>Ejemplos de IPC</h4><p>POSIX, Mach y Windows XP.</p></button>
    <button class="card mini lnk" data-go="8"><div class="ico c">8</div><h4>Cliente-servidor</h4><p>Sockets, llamadas a procedimientos remotos (RPC) e invocación de métodos remotos (RMI).</p></button>
    <button class="card mini lnk" data-go="9"><div class="ico">9</div><h4>Línea de tiempo</h4><p>La vida completa de un proceso, de principio a fin.</p></button>

  <h2>Cómo usar este OVA</h2>
  <div class="grid2">
    <div class="card mini"><h4>Diagramas paso a paso</h4><p>Los recuadros con barra de control («Anterior», «Siguiente», «Reproducir») muestran un proceso dinámico. Cada paso resalta lo que ocurre y lo explica debajo.</p></div>
    <div class="card mini"><h4>Elementos que se despliegan</h4><p>Pestañas, acordeones y bloques con botones muestran más detalle al hacer clic. Todo el contenido es de consulta: no hay evaluaciones.</p></div>
    <div class="card mini"><h4>Navegación</h4><p>Usa el menú lateral, los botones «Anterior/Siguiente» al final de cada módulo o las teclas <code>←</code> y <code>→</code> (también <code>Alt</code> + flechas) para moverte.</p></div>
    <div class="card mini"><h4>Referencias cruzadas</h4><p>En cada módulo se indica la sección del libro (por ejemplo «Sección 3.2.3») para que puedas profundizar en el texto original.</p></div>

  <h2>Antes de empezar</h2>
  <p>Conviene tener presentes algunas ideas de capítulos previos del libro:</p>
  <ul>
    <li>El <strong>kernel</strong> (núcleo) es la parte del sistema operativo que gestiona los recursos de la computadora.</li>
    <li>Una <strong>interrupción</strong> obliga a la CPU a abandonar su tarea actual para ejecutar una rutina del kernel.</li>
    <li>Una <strong>llamada al sistema</strong> es la forma en que un programa solicita servicios al sistema operativo.</li>
  </ul>
  <div class="pager"><span></span><button class="btn" data-next>Siguiente: El proceso</button></div>

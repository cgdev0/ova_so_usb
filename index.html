<section class="page" id="p2" data-title="The process" data-short="The process">
  <span class="kicker">Module 2. Section 3.1 of the book</span>
  <h1 class="page-title">The process concept</h1>
  <p class="lead">A <strong>process</strong> is a program in execution. It is the unit of work in modern time-sharing systems.</p>

  <h2><span class="sn">2.1</span>Why the concept appeared</h2>
  <p>Early computer systems allowed only one program to run at a time, and that program had complete control of the system and access to all its resources. Current systems load <strong>multiple programs into memory</strong> and run them concurrently. That evolution demands more <strong>control and isolation</strong> between programs, and the notion of a process was born from that need.</p>
  <div class="grid2">
    <div class="card mini"><h4>Operating-system processes</h4><p>They run system code: tasks that, for one reason or another, are not inside the kernel.</p></div>
    <div class="card mini"><h4>User processes</h4><p>They run user code: the browser, the word processor, the email client…</p></div>
  </div>
  <p>Potentially all of them run concurrently, <strong>multiplexing the CPU</strong> (or the several CPUs) among them. By switching the CPU between processes, the operating system increases the computer's throughput.</p>
  <div class="callout dato"><span class="t">Terminology</span><p>The book uses “job” and “process” interchangeably. “Job” comes from the era of batch systems and is still present in expressions such as <em>job scheduling</em>. Although “process” is preferred, the other term is not avoided.</p></div>

  <h2><span class="sn">2.2</span>What a process contains</h2>
  <p>A process is <strong>more than the program code</strong>. It also includes its current activity and several memory areas. Select each segment to see its role.</p>
  <div class="memwrap">
    <div>
      <div class="mem" id="mem" role="group" aria-label="Structure of a process in memory"></div>
      <div class="addr"><span>High addresses ↑</span><span>↓ low</span></div>
    </div>
    <div class="detail" id="mem-detail" aria-live="polite"></div>
  </div>
  <p class="src"><b>Figure 3.1 in the book:</b> process in memory (own representation).</p>
  <div class="callout idea"><span class="t">Key idea</span><p>The <strong>current activity</strong> of a process is represented by the value of the <strong>program counter</strong> and the contents of the <strong>processor registers</strong>.</p></div>

  <h2><span class="sn">2.3</span>A program and a process are not the same thing</h2>
  <div class="tw"><table>
    <thead><tr><th></th><th>Program</th><th>Process</th></tr></thead>
    <tbody>
      <tr><th>Nature</th><td><strong>Passive</strong> entity.</td><td><strong>Active</strong> entity.</td></tr>
      <tr><th>What it is</th><td>A file with a list of instructions stored on disk (an executable file).</td><td>A program loaded into memory, with a program counter and associated resources.</td></tr>
      <tr><th>Next instruction</th><td>Not applicable.</td><td>Given by the program counter.</td></tr>
      <tr><th>How it originates</th><td>It is written and compiled.</td><td>It is created when the executable file is loaded into memory.</td></tr>
    </tbody>
  </table></div>
  <p>A program becomes a process when an executable file is loaded into memory. Two common ways are <strong>double-clicking</strong> the executable's icon or <strong>typing its name on the command line</strong> (for example <code>prog.exe</code> or <code>a.out</code>).</p>
  <h3>One program, several processes</h3>
  <p>Two processes may be associated with the same program and still be <strong>separate execution sequences</strong>. Several users may run copies of the mail program, or one user may open many browser windows. The text section is equivalent, but the <strong>data, heap and stack sections differ</strong> from one process to another.</p>
  <div class="fig" data-d="twoproc">
    <div class="fig-head"><b>Two processes of the same program</b><span>Illustration</span></div>
    <div class="stage"></div>
    <p class="caption" style="min-height:0"><b>Reading:</b> the code is the same, but each process has its own program counter, stack, data and heap. That is why one can be at a different instruction from the other.</p>
  </div>

  <h2><span class="sn">2.4</span>Threads (introduction)</h2>
  <p>The model seen so far assumes that a process is a program with <strong>a single thread of execution</strong>. With one thread of control, the process can do only one task at a time: for example, the user cannot type characters and run the spelling checker at the same time within the same process.</p>
  <p>Most modern operating systems extend the concept so that a process can have <strong>multiple threads</strong>, which can run several tasks at once. This is especially useful on systems with multiple processing cores. Threads are studied in depth in Chapter 4 of the book.</p>

  <div class="key"><h3>Key ideas of the module</h3>
    <ul>
      <li>A process is a <strong>program in execution</strong>; a program by itself is passive.</li>
      <li>It includes code, program counter and registers, stack, data section and heap.</li>
      <li>One program can give rise to several independent processes.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Previous: Introduction</button><button class="btn" data-next>Next: States and PCB</button></div>
</section>

<section class="page" id="p3" data-title="Process states and PCB" data-short="States and PCB">
  <span class="kicker">Module 3. Sections 3.1.2 and 3.1.3 of the book</span>
  <h1 class="page-title">Process states and the process control block (PCB)</h1>
  <p class="lead">As it executes, a process changes state. The operating system keeps track of each process through a data structure of its own: its control block.</p>

  <h2><span class="sn">3.1</span>The five states</h2>
  <p>The state of a process is defined, in part, by its <strong>current activity</strong>. Each process can be in one of these states:</p>
  <div class="grid3">
    <div class="card mini"><div class="ico">N</div><h4>New</h4><p>The process is being created.</p></div>
    <div class="card mini"><div class="ico">R</div><h4>Ready</h4><p>It is waiting to be assigned to a processor.</p></div>
    <div class="card mini"><div class="ico">R</div><h4>Running</h4><p>Its instructions are being executed.</p></div>
    <div class="card mini"><div class="ico c">W</div><h4>Waiting</h4><p>It is waiting for some event to occur, such as the completion of an I/O operation or the reception of a signal.</p></div>
    <div class="card mini"><div class="ico c">T</div><h4>Terminated</h4><p>The process has finished executing.</p></div>
    <div class="card mini" style="background:var(--amber-bg);border-color:#efd18c"><h4 style="color:var(--amber)">Arbitrary names</h4><p>The names vary from one operating system to another, but the states they represent exist in all of them. Some systems define them more specifically.</p></div>
  </div>

  <h3>State diagram</h3>
  <p>Go through a typical life cycle or select a state in the diagram to see its description.</p>
  <div class="fig" data-d="state">
    <div class="fig-head"><b>Process state diagram</b><span>Interactive</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="hint">Tip: you can click any state in the diagram.</p>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="callout ojo"><span class="t">Important</span><p>On any processor, at any given instant, <strong>only one process can be running</strong>. However, many processes can be ready and waiting.</p></div>

  <h2><span class="sn">3.2</span>The process control block (PCB)</h2>
  <p>Each process is represented in the operating system by a <strong>process control block</strong> (PCB), also called a task control block. It contains the pieces of information associated with that specific process. Select each field:</p>
  <div class="memwrap">
    <div class="pcb" id="pcb" role="group" aria-label="Fields of the process control block"></div>
    <div class="detail" id="pcb-detail" aria-live="polite"></div>
  </div>
  <p class="src"><b>Figure 3.3 in the book:</b> process control block (own representation).</p>
  <div class="callout idea"><span class="t">In short</span><p>The PCB simply serves as the <strong>repository for any information that may vary from process to process</strong>. When an interrupt occurs, the CPU state is saved along with the program counter so the process can later continue correctly.</p></div>

  <div class="key"><h3>Key ideas of the module</h3>
    <ul>
      <li>The states are: new, ready, running, waiting and terminated.</li>
      <li>Only one process per processor can be running at a given instant.</li>
      <li>The PCB stores everything needed to stop a process and resume it later.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Previous: The process</button><button class="btn" data-next>Next: Scheduling</button></div>
</section>

<section class="page" id="p4" data-title="Process scheduling" data-short="Scheduling">
  <span class="kicker">Module 4. Section 3.2 of the book</span>
  <h1 class="page-title">Process scheduling</h1>
  <p class="lead">The <strong>process scheduler</strong> selects an available process, among several, to run on the CPU. On a single-processor system there will never be more than one running process: the others wait until the CPU is free.</p>
  <div class="grid2">
    <div class="card mini"><h4>Goal of multiprogramming</h4><p>Have some process running at all times in order to maximize CPU use.</p></div>
    <div class="card mini"><h4>Goal of time sharing</h4><p>Switch the CPU among processes so frequently that users can interact with each program while it runs.</p></div>
  </div>

  <h2><span class="sn">4.1</span>Scheduling queues</h2>
  <p>During its life, a process moves among several queues:</p>
  <ul>
    <li><strong>Job queue:</strong> contains all the processes in the system.</li>
    <li><strong>Ready queue:</strong> processes that reside in main memory, ready and waiting to execute. It is usually a <em>linked list</em>: the header points to the first and last PCB, and each PCB has a pointer to the next one.</li>
    <li><strong>Device queues:</strong> processes waiting for a particular I/O device (for example, a busy disk). Each device has its own.</li>
  </ul>
  <p>A <strong>queueing diagram</strong> represents scheduling: rectangles are queues, circles are the resources that serve them, and arrows show the flow of processes.</p>
  <div class="fig" data-d="queues">
    <div class="fig-head"><b>Queueing diagram with four processes</b><span>Step-by-step animation</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <h3>What can happen to a process on the CPU</h3>
  <p>When a new process enters, it waits in the ready queue until it is <strong>dispatched</strong>. Once it is assigned the CPU, one of these things can happen:</p>
  <div class="grid3">
    <div class="card mini"><div class="ico">1</div><h4>Requests I/O</h4><p>It moves to an I/O queue.</p></div>
    <div class="card mini"><div class="ico">2</div><h4>Creates a subprocess</h4><p>It waits for it to finish.</p></div>
    <div class="card mini"><div class="ico">3</div><h4>Is preempted</h4><p>An interrupt sends it back to the ready queue.</p></div>
  </div>
  <p>In the first two cases, the process will move from the waiting state to the ready state and return to the ready queue. The cycle repeats until the process terminates; then it is removed from all queues and its PCB and resources are released.</p>

  <h2><span class="sn">4.2</span>Schedulers</h2>
  <p>The operating system selects processes from the queues using an appropriate <strong>scheduler</strong>. There are three levels:</p>
  <div class="tw"><table>
    <thead><tr><th></th><th>Long-term<br><small>(job scheduler)</small></th><th>Short-term<br><small>(CPU scheduler)</small></th><th>Medium-term</th></tr></thead>
    <tbody>
      <tr><th>What it does</th><td>Selects processes from the job queue (on disk) and loads them into memory for execution.</td><td>Chooses, among the ready processes, the one that gets the CPU.</td><td>Removes processes from memory and brings them back later (<em>swapping</em>).</td></tr>
      <tr><th>Frequency</th><td>Low: minutes may pass between runs.</td><td>High: at least about once every 100 ms.</td><td>Intermediate; only in some systems.</td></tr>
      <tr><th>Demand</th><td>Can take more time to decide.</td><td>Must be very fast.</td><td>Improves the process mix or frees memory.</td></tr>
      <tr><th>Controls</th><td>The <strong>degree of multiprogramming</strong> (number of processes in memory).</td><td>Which process runs next.</td><td>Reduces the degree of multiprogramming.</td></tr>
    </tbody>
  </table></div>
  <div class="callout dato"><span class="t">A calculation</span><p>If the short-term scheduler takes 10 ms to decide and the process then runs for 100 ms, the time wasted on scheduling is 10 / (100 + 10) ≈ <strong>9%</strong> of the CPU time. That is why it must be fast.</p></div>

  <h3>I/O-bound and CPU-bound processes</h3>
  <p>Most processes can be described as one of these two classes:</p>
  <div class="fig" data-d="bursts">
    <div class="fig-head"><b>CPU usage profile</b><span>Comparison</span></div>
    <div class="stage"></div>
    <p class="caption" style="min-height:0"><b>Reading:</b> the green bars are computing time on the CPU; the grey ones are time spent waiting for I/O operations.</p>
  </div>
  <p>It is important for the long-term scheduler to choose a <strong>balanced mix</strong>. If all processes were I/O-bound, the ready queue would almost always be empty and the short-term scheduler would have little to do. If all were CPU-bound, the I/O waiting queue would almost always be empty, devices would hardly be used, and the system would also become unbalanced.</p>
  <p>Some systems, such as the time-sharing UNIX and Microsoft Windows systems, often have no long-term scheduler: they put every new process in memory and the short-term scheduler manages it. Their stability depends on a physical limitation (such as the number of terminals) or on the self-adjusting nature of users.</p>

  <h3>Medium-term scheduling</h3>
  <p>Sometimes it is worthwhile to <strong>remove processes from memory</strong>, thereby reducing the degree of multiprogramming, and to reload them later so they continue where they left off. This scheme is called <strong>swapping</strong> and may be necessary to improve the process mix or because a change in memory requirements has forced memory to be freed (it is studied in Chapter 8).</p>
  <div class="fig" data-d="swap">
    <div class="fig-head"><b>Swapping with the medium-term scheduler</b><span>Diagram</span></div>
    <div class="stage"></div>
  </div>

  <h2><span class="sn">4.3</span>Context switch</h2>
  <p>When an interrupt occurs, the system must <strong>save the context</strong> of the process running on the CPU so it can be restored later. The context is stored in the PCB and includes the CPU registers, the process state and the memory-management information. Switching the CPU to another process requires saving the state of the current process and restoring the state of a different one: that task is the <strong>context switch</strong>.</p>
  <div class="fig" data-d="seq-ctx">
    <div class="fig-head"><b>CPU switching between two processes</b><span>Step by step</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="grid2">
    <div class="callout ojo" style="margin:0"><span class="t">Cost</span><p>The time spent on a context switch is <strong>wasted time</strong>: during the switch the system does no useful work. The book cites speeds on the order of a few milliseconds, which vary by machine.</p></div>
    <div class="callout dato" style="margin:0"><span class="t">Hardware</span><p>It depends on processor support: some, such as UltraSPARC, provide several register sets, and the switch consists of changing a pointer. If there are more active processes than register sets, data is copied to memory again.</p></div>
  </div>

  <div class="key"><h3>Key ideas of the module</h3>
    <ul>
      <li>There are three kinds of queues: job, ready and device queues.</li>
      <li>The long-term scheduler controls the degree of multiprogramming; the short-term scheduler assigns the CPU.</li>
      <li>The context switch saves and restores state in the PCBs and is unproductive time.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Previous: States and PCB</button><button class="btn" data-next>Next: Operations</button></div>
</section>
<section class="page" id="p5" data-title="Operations on processes" data-short="Operations">
  <span class="kicker">Module 5. Section 3.3 of the book</span>
  <h1 class="page-title">Operations on processes</h1>
  <p class="lead">In most systems, processes run concurrently and can be <strong>created and deleted dynamically</strong>. For that reason the operating system must provide mechanisms for creating and terminating processes.</p>

  <h2><span class="sn">5.1</span>Process creation</h2>
  <p>A process can create other processes while it runs, using a specific <strong>system call</strong>. The creating process is the <strong>parent</strong> and the new processes are its <strong>children</strong>. Each child can in turn create other processes, forming a <strong>process tree</strong>.</p>
  <p>Most systems (UNIX and the Windows family included) identify each process with a <strong>process identifier</strong> or <strong>pid</strong>, normally a unique integer.</p>

  <h3>Example: process tree in Solaris</h3>
  <p>Select a process to see its role. The book presents this tree as an example; here it is rebuilt from the data in the text.</p>
  <div class="treewrap">
    <ul class="tree" id="tree" aria-label="Solaris process tree"></ul>
    <div class="detail" id="tree-detail" aria-live="polite"></div>
  </div>
  <div class="callout dato"><span class="t">In UNIX</span><p>The <code>ps -el</code> command lists complete information about all active processes. It is easy to build a tree like the one above by recursively following parent processes up to <code>init</code>.</p></div>

  <h3>Resources and execution of the child</h3>
  <p>A process needs resources (CPU time, memory, files, I/O devices). A subprocess can obtain them <strong>directly from the operating system</strong> or be <strong>restricted to a subset of the parent's resources</strong>, which prevents a process from overloading the system by creating too many subprocesses. The parent can also pass <strong>initialization data</strong> to the child (for example, the name of a file it must display).</p>
  <p>When a process is created, there are two pairs of possibilities:</p>
  <div class="grid2">
    <div class="card"><h3>Regarding execution</h3><ol><li>The parent continues to execute <strong>concurrently</strong> with its child.</li><li>The parent <strong>waits</strong> until some or all of its children terminate.</li></ol></div>
    <div class="card"><h3>Regarding the address space</h3><ol><li>The child is a <strong>duplicate</strong> of the parent (same program and data).</li><li>The child <strong>loads a new program</strong>.</li></ol></div>
  </div>

  <h3>Creation in UNIX: fork(), exec() and wait()</h3>
  <ul>
    <li><code>fork()</code> creates a new process whose address space is a <strong>copy</strong> of the original. Parent and child continue at the instruction following <code>fork()</code>. With one difference: the returned value is <strong>0 in the child</strong> and the <strong>child's pid</strong> (nonzero) in the parent.</li>
    <li><code>exec()</code> (for example <code>execlp()</code>) loads a binary file into memory, <strong>destroying the previous image</strong>, and starts executing it.</li>
    <li><code>wait()</code> lets the parent <strong>remove itself from the ready queue</strong> until the child terminates.</li>
  </ul>
  <div class="fig" data-d="seq-fork">
    <div class="fig-head"><b>Creating a process in UNIX</b><span>Step by step</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="cap-title">Program outline (simplified C pseudocode)</div>
<pre class="code" aria-label="Pseudocode for fork, exec and wait"><span class="ln" data-l="0">pid = <span class="f">fork</span>();                       <span class="c">/* creates the child */</span></span><span class="ln" data-l="1"><span class="k">if</span> (pid &lt; 0) {                        <span class="c">/* error: could not create */</span></span><span class="ln" data-l="1">    <span class="f">fprintf</span>(stderr, <span class="s">"Fork failed"</span>);</span><span class="ln" data-l="2">} <span class="k">else if</span> (pid == 0) {              <span class="c">/* CHILD path */</span></span><span class="ln" data-l="2">    <span class="f">execlp</span>(<span class="s">"/bin/ls"</span>, <span class="s">"ls"</span>, NULL);   <span class="c">/* replaces its image with ls */</span></span><span class="ln" data-l="3">} <span class="k">else</span> {                          <span class="c">/* PARENT path */</span></span><span class="ln" data-l="3">    <span class="f">wait</span>(NULL);                      <span class="c">/* waits for the child to finish */</span></span><span class="ln" data-l="4">    <span class="f">printf</span>(<span class="s">"Child complete"</span>);</span><span class="ln" data-l="4">}</span></pre>
  <p class="src">Illustrative code written for this OVA; it follows the logic of the Figure 3.10 example in the book.</p>

  <h3>Creation in Windows: CreateProcess()</h3>
  <p>In the Win32 API, processes are created with <code>CreateProcess()</code>, similar to <code>fork()</code> in that a parent creates a child, but with important differences:</p>
  <div class="tw"><table>
    <thead><tr><th></th><th><code>fork()</code> (UNIX)</th><th><code>CreateProcess()</code> (Win32)</th></tr></thead>
    <tbody>
      <tr><th>Child's address space</th><td>Inherits the parent's (a copy).</td><td>A specific program is loaded during creation.</td></tr>
      <tr><th>Parameters</th><td>None.</td><td>At least ten different parameters.</td></tr>
      <tr><th>Waiting for the child</th><td><code>wait()</code></td><td><code>WaitForSingleObject()</code>, passing it the child process's handle.</td></tr>
    </tbody>
  </table></div>
  <p>Two of the parameters are structures: <code>STARTUPINFO</code> (properties of the new process, such as window size and appearance and the standard input and output files) and <code>PROCESS_INFORMATION</code> (handles and identifiers of the newly created process and its thread). In the book's example, the child loads the <code>mspaint.exe</code> application.</p>

  <h2><span class="sn">5.2</span>Process termination</h2>
  <p>A process terminates when it executes its last instruction and asks the operating system to delete it with the <code>exit()</code> call. At that point it can return a <strong>status value</strong> (normally an integer) to its parent, through <code>wait()</code>. The operating system <strong>releases all the process's resources</strong>: physical and virtual memory, open files and I/O buffers.</p>
  <p>A process can also cause the termination of another with an appropriate call (for example <code>TerminateProcess()</code> in Win32). Normally only the <strong>parent</strong> can do so; otherwise users could arbitrarily kill each other's jobs. That is why the parent needs to know the identities of its children: when a process is created, the identifier of the new process is passed to the parent.</p>
  <h3>Why a parent terminates a child</h3>
  <div class="grid3">
    <div class="card mini"><div class="ico">1</div><h4>Excess resources</h4><p>The child has exceeded its allocated use of some resources. The parent must be able to inspect the state of its children.</p></div>
    <div class="card mini"><div class="ico">2</div><h4>Task no longer needed</h4><p>The task assigned to the child is no longer required.</p></div>
    <div class="card mini"><div class="ico">3</div><h4>The parent exits</h4><p>The parent leaves the system and the operating system does not allow the child to continue.</p></div>
  </div>
  <h3>What happens to children when the parent terminates</h3>
  <div class="tabs" data-tabs>
    <div class="tablist" role="tablist"><button role="tab">Cascading termination</button><button role="tab">UNIX: adoption by init</button></div>
    <div class="tabpanel" role="tabpanel">
      <p>Some systems, such as <strong>VMS</strong>, do not allow a child to exist if its parent has terminated. If a process terminates (normally or abnormally), <strong>all its children must also terminate</strong>. This phenomenon is called <strong>cascading termination</strong> and is normally initiated by the operating system.</p>
      <div class="fig" data-d="cascade" style="margin-bottom:0"><div class="stage"></div></div>
    </div>
    <div class="tabpanel" role="tabpanel">
      <p>In <strong>UNIX</strong>, if the parent terminates, all its children are assigned the <code>init</code> process as their <strong>new parent</strong>. That way the children still have a parent to which they can report their status and execution statistics.</p>
      <p><code>wait()</code> returns the identifier of the child that terminated, so the parent knows which of its many children has finished.</p>
      <div class="fig" data-d="adopt" style="margin-bottom:0"><div class="stage"></div></div>
    </div>
  </div>

  <div class="key"><h3>Key ideas of the module</h3>
    <ul>
      <li>Processes form a tree: each has a parent and may have children, identified by their pid.</li>
      <li>In UNIX, <code>fork()</code> duplicates the process; <code>exec()</code> replaces it with another program; <code>wait()</code> synchronizes the parent with the child.</li>
      <li>On termination, the system releases the resources and the child returns its status to the parent.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Previous: Scheduling</button><button class="btn" data-next>Next: Interprocess communication</button></div>
</section>

<section class="page" id="p6" data-title="Interprocess communication" data-short="Interprocess communication">
  <span class="kicker">Module 6. Section 3.4 of the book</span>
  <h1 class="page-title">Interprocess communication (IPC)</h1>
  <p class="lead">Processes that run concurrently can be <strong>independent</strong> or <strong>cooperating</strong>. When they cooperate, they need mechanisms to exchange data and information.</p>

  <h2><span class="sn">6.1</span>Independent and cooperating processes</h2>
  <div class="grid2">
    <div class="card"><h3>Independent</h3><p>It cannot affect or be affected by the other processes in the system. Any process that <strong>does not share data</strong> with another is independent.</p></div>
    <div class="card"><h3>Cooperating</h3><p>It can affect or be affected by the others. Any process that <strong>shares data</strong> with other processes is cooperating.</p></div>
  </div>
  <h3>Reasons for allowing cooperation</h3>
  <div class="grid4">
    <div class="card mini"><div class="ico">1</div><h4>Information sharing</h4><p>Several users may want the same information (a shared file): concurrent access is needed.</p></div>
    <div class="card mini"><div class="ico">2</div><h4>Computation speedup</h4><p>Split a task into subtasks that run in parallel; it only helps if there are multiple CPUs or I/O channels.</p></div>
    <div class="card mini"><div class="ico c">3</div><h4>Modularity</h4><p>Divide the system functions into separate processes or threads.</p></div>
    <div class="card mini"><div class="ico c">4</div><h4>Convenience</h4><p>A single user can edit, print and compile at the same time.</p></div>
  </div>

  <h2><span class="sn">6.2</span>The two communication models</h2>
  <p>There are two fundamental models: <strong>shared memory</strong> and <strong>message passing</strong>. Many operating systems implement both.</p>
  <div class="fig" data-d="models">
    <div class="fig-head"><b>Interprocess communication models</b><span>Comparison</span></div>
    <div class="stage"></div>
  </div>
  <div class="tw"><table>
    <thead><tr><th></th><th>Shared memory</th><th>Message passing</th></tr></thead>
    <tbody>
      <tr><th>Idea</th><td>A shared memory region is established; the processes read and write in it.</td><td>The processes exchange messages using <code>send()</code> and <code>receive()</code>.</td></tr>
      <tr><th>Kernel involvement</th><td>Only to set up the region; afterwards they are ordinary memory accesses.</td><td>On every exchange, normally through system calls.</td></tr>
      <tr><th>Speed</th><td>Maximum: done at memory speed within a single computer.</td><td>Slower because of kernel intervention.</td></tr>
      <tr><th>When it fits</th><td>Large amounts of data on one machine.</td><td>Small amounts of data (no conflicts to avoid) and communication between computers; easier to implement.</td></tr>
      <tr><th>Responsibility</th><td>The processes: format, location and avoiding simultaneous writes.</td><td>The operating system.</td></tr>
    </tbody>
  </table></div>

  <h2><span class="sn">6.3</span>Shared-memory systems</h2>
  <p>A shared memory region usually resides in the address space of the process that creates the segment. Other processes that want to use it must <strong>attach</strong> it to their own address space. Normally the system tries to prevent one process from accessing another's memory; shared memory requires the processes to <strong>agree to remove that restriction</strong>.</p>
  <h3>The producer-consumer problem</h3>
  <p>It is a widely used paradigm for cooperating processes: a <strong>producer</strong> generates information that a <strong>consumer</strong> consumes. For example, a compiler generates assembly code that an assembler consumes, and the assembler generates object modules that the loader consumes. It is also a metaphor for the client-server model: the server produces (for example, HTML files) and the client consumes (the browser).</p>
  <p>One solution uses a <strong>buffer</strong> in shared memory that the producer fills and the consumer empties. They must be synchronized so the consumer does not try to consume something that has not yet been produced.</p>
  <div class="grid2">
    <div class="card mini"><h4>Unbounded buffer</h4><p>No limit on size. The consumer may have to wait for new items, but the producer can always produce.</p></div>
    <div class="card mini"><h4>Bounded buffer</h4><p>Fixed size. The consumer waits if the buffer is empty and the producer waits if it is full.</p></div>
  </div>
  <p>In the book's scheme the buffer is a <strong>circular array</strong> with two logical pointers: <code>in</code> (next free position) and <code>out</code> (first occupied position). Try it out:</p>
  <div class="fig" data-d="ring">
    <div class="fig-head"><b>Shared circular buffer (size 8)</b><span>Demo</span></div>
    <div class="stage"></div>
    <div class="ring-stat" id="ring-stat"></div>
    <div class="stepbar" id="ring-ctl"></div>
    <p class="caption" id="ring-cap" aria-live="polite">Press “Produce” to add an item or “Consume” to remove one.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Condition</th><th>Expression</th></tr></thead>
    <tbody>
      <tr><th>Buffer empty</th><td><code>in == out</code></td></tr>
      <tr><th>Buffer full</th><td><code>((in + 1) % BUFFER_SIZE) == out</code></td></tr>
    </tbody>
  </table></div>
  <div class="cap-title">Producer and consumer (simplified outline)</div>
<pre class="code"><span class="c">/* Producer */</span>
<span class="k">while</span> (true) {
    <span class="c">/* produce an item in nextProduced */</span>
    <span class="k">while</span> (((in + 1) % BUFFER_SIZE) == out)
        ;                                  <span class="c">/* buffer full: do nothing */</span>
    buffer[in] = nextProduced;
    in = (in + 1) % BUFFER_SIZE;
}

<span class="c">/* Consumer */</span>
<span class="k">while</span> (true) {
    <span class="k">while</span> (in == out)
        ;                                  <span class="c">/* buffer empty: do nothing */</span>
    nextConsumed = buffer[out];
    out = (out + 1) % BUFFER_SIZE;
    <span class="c">/* consume the item in nextConsumed */</span>
}</pre>
  <p class="src">Illustrative code written for this OVA; it follows the logic of Figures 3.14 and 3.15 in the book.</p>
  <div class="callout ojo"><span class="t">Limitations</span><p>This scheme allows at most <strong>BUFFER_SIZE − 1</strong> items at a time. Nor does it address what happens when producer and consumer access the buffer <em>concurrently</em>: synchronization is studied in Chapter 6 of the book.</p></div>

  <h2><span class="sn">6.4</span>Message-passing systems</h2>
  <p>Message passing lets processes <strong>communicate and synchronize their actions without sharing the same address space</strong>. It is especially useful in distributed environments, where the processes reside on different computers connected over a network (for example, a chat program).</p>
  <p>It provides at least two operations: <code>send(message)</code> and <code>receive(message)</code>. Messages can be <strong>fixed-size</strong> (simple implementation, harder programming) or <strong>variable-size</strong> (more complex implementation, easier programming): a common trade-off in operating-system design.</p>
  <p>If processes P and Q want to communicate, a <strong>communication link</strong> must exist between them. The book focuses on its logical implementation, which is decided in three respects:</p>

  <div class="tabs" data-tabs>
    <div class="tablist" role="tablist"><button role="tab">Naming</button><button role="tab">Synchronization</button><button role="tab">Buffering</button></div>

    <div class="tabpanel" role="tabpanel">
      <p>Processes need a way to refer to each other: <strong>direct</strong> or <strong>indirect</strong> communication.</p>
      <div class="fig" data-d="naming" style="box-shadow:none"><div class="stage"></div></div>
      <div class="tw"><table>
        <thead><tr><th></th><th>Direct (symmetric)</th><th>Direct (asymmetric)</th><th>Indirect (mailboxes)</th></tr></thead>
        <tbody>
          <tr><th>Primitives</th><td><code>send(P, msg)</code><br><code>receive(Q, msg)</code></td><td><code>send(P, msg)</code><br><code>receive(id, msg)</code></td><td><code>send(A, msg)</code><br><code>receive(A, msg)</code></td></tr>
          <tr><th>Who names whom</th><td>Sender and receiver name each other.</td><td>Only the sender names the receiver; <code>id</code> receives the sender's name.</td><td>Both name a mailbox (or port).</td></tr>
          <tr><th>Link</th><td>Exactly two processes; one link per pair; established automatically.</td><td>Same as symmetric.</td><td>Only if they share a mailbox; can be associated with more than two processes; there can be several links between a pair.</td></tr>
          <tr><th>Drawback</th><td colspan="2">Limited modularity: changing an identifier forces changes in every definition that uses it (hard-coding).</td><td>—</td></tr>
        </tbody>
      </table></div>
      <h3>Mailbox ownership</h3>
      <ul>
        <li>If it is <strong>owned by a process</strong> (part of its address space), the owner can only receive and the users can only send. When the owner terminates, the mailbox disappears and anyone writing to it afterwards must be notified.</li>
        <li>If it is <strong>owned by the operating system</strong>, it has an existence of its own: the system lets a process create it, send and receive, and delete it. By default the creator is its owner, and ownership can be transferred.</li>
      </ul>
      <p>If several processes share a mailbox and more than one tries to receive, who gets the message depends on the chosen policy: limit each link to two processes, allow only one receiver at a time, or let the system choose (arbitrarily or in turns).</p>
    </div>

    <div class="tabpanel" role="tabpanel">
      <p>Message passing can be <strong>blocking</strong> (synchronous) or <strong>nonblocking</strong> (asynchronous).</p>
      <div class="grid2">
        <div class="card mini"><h4>Blocking send</h4><p>The sender is blocked until the receiver or the mailbox receives the message.</p></div>
        <div class="card mini"><h4>Nonblocking send</h4><p>The sender sends the message and continues operating.</p></div>
        <div class="card mini"><h4>Blocking receive</h4><p>The receiver is blocked until a message is available.</p></div>
        <div class="card mini"><h4>Nonblocking receive</h4><p>The receiver gets either a valid message or a null message.</p></div>
      </div>
      <p>When <code>send()</code> and <code>receive()</code> are both blocking, there is a <strong>rendezvous</strong> between sender and receiver. With them, the solution to the producer-consumer problem is trivial.</p>
      <div class="fig" data-d="seq-rdv" style="box-shadow:none">
        <div class="fig-head"><b>Rendezvous: blocking send and receive</b><span>Step by step</span></div>
        <div class="stage"></div><div class="stepbar"></div>
        <p class="caption" aria-live="polite"></p>
      </div>
    </div>

    <div class="tabpanel" role="tabpanel">
      <p>The messages exchanged reside in a <strong>temporary queue</strong>, in both direct and indirect communication. It is implemented in three ways:</p>
      <div class="grid3">
        <div class="card mini"><div class="ico">0</div><h4>Zero capacity</h4><p>The queue has maximum length zero; no message can wait in the link. The sender is blocked until the receiver gets the message.</p></div>
        <div class="card mini"><div class="ico">n</div><h4>Bounded capacity</h4><p>Finite length <em>n</em>. If it is not full, the message enters and the sender continues; if it is full, the sender is blocked until there is space.</p></div>
        <div class="card mini"><div class="ico">∞</div><h4>Unbounded capacity</h4><p>Potentially infinite length; the sender never blocks.</p></div>
      </div>
      <p class="src">Zero capacity is known as a message system <strong>with no buffering</strong>; the other cases, as systems with <strong>automatic buffering</strong>.</p>
      <div class="fig" data-d="buffers" style="box-shadow:none"><div class="stage"></div></div>
    </div>
  </div>

  <div class="key"><h3>Key ideas of the module</h3>
    <ul>
      <li>Cooperating processes need IPC: shared memory or message passing.</li>
      <li>Shared memory is faster; message passing is simpler and works between computers.</li>
      <li>Message-passing design is defined along three axes: naming, synchronization and buffering.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Previous: Operations</button><button class="btn" data-next>Next: IPC examples</button></div>
</section>

<section class="page" id="p7" data-title="IPC system examples" data-short="IPC examples">
  <span class="kicker">Module 7. Section 3.5 of the book</span>
  <h1 class="page-title">Examples of IPC systems</h1>
  <p class="lead">The book analyzes three real systems: the <strong>POSIX API</strong> for shared memory, message passing in the <strong>Mach</strong> operating system, and the <strong>Windows XP</strong> facility, which uses shared memory to provide message passing.</p>

  <h2><span class="sn">7.1</span>Shared memory in POSIX</h2>
  <p>POSIX systems offer several IPC mechanisms, including shared memory and message passing. Using shared memory follows five system calls:</p>
  <div class="grid2">
    <div class="card mini"><h4><code>shmget()</code> — create</h4><p>Creates the segment (<em>Shared Memory GET</em>). It takes the key (<code>IPC_PRIVATE</code> creates a new one), the size in bytes and the usage mode (read, write or both). It returns an integer identifier.</p></div>
    <div class="card mini"><h4><code>shmat()</code> — attach</h4><p>Associates the segment with the address space (<em>Shared Memory ATtach</em>). It takes the identifier, the desired location (<code>NULL</code>: the system chooses) and a mode flag (0: read and write). It returns a pointer.</p></div>
    <div class="card mini"><h4>Normal access</h4><p>With the returned pointer you read and write as in any memory access; the kernel no longer intervenes. The other attached processes see the updates.</p></div>
    <div class="card mini"><h4><code>shmdt()</code> and <code>shmctl()</code></h4><p><code>shmdt()</code> detaches the segment from the address space. <code>shmctl()</code> with <code>IPC_RMID</code> removes it from the system.</p></div>
  </div>
  <div class="fig" data-d="seq-shm">
    <div class="fig-head"><b>Life cycle of a shared memory segment</b><span>Step by step</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
<pre class="code" aria-label="POSIX shared memory fragment"><span class="c">/* create a 4096-byte segment, accessible only by its owner */</span>
segment_id = <span class="f">shmget</span>(IPC_PRIVATE, 4096, S_IRUSR | S_IWUSR);

<span class="c">/* attach it to the address space */</span>
shared_memory = (<span class="k">char</span> *) <span class="f">shmat</span>(segment_id, NULL, 0);

<span class="f">sprintf</span>(shared_memory, <span class="s">"Hello!"</span>);   <span class="c">/* write as in normal memory */</span>
<span class="f">printf</span>(<span class="s">"%s\n"</span>, shared_memory);

<span class="f">shmdt</span>(shared_memory);                  <span class="c">/* detach */</span>
<span class="f">shmctl</span>(segment_id, IPC_RMID, NULL);   <span class="c">/* remove the segment */</span></pre>
  <p class="src">Illustrative code written for this OVA; it follows the logic of the Figure 3.16 program in the book.</p>

  <h2><span class="sn">7.2</span>Mach: a message-based system</h2>
  <p>Mach, developed at Carnegie Mellon University, is part of Mac OS X. Its kernel allows the creation and destruction of multiple <strong>tasks</strong>, similar to processes but with multiple threads of control. <strong>Most communication</strong> —including most system calls and all intertask communication— is done through <strong>messages</strong>, which are sent and received through <strong>mailboxes called ports</strong>.</p>
  <div class="grid3">
    <div class="card mini"><h4><code>msg_send()</code></h4><p>Sends a message to a mailbox.</p></div>
    <div class="card mini"><h4><code>msg_receive()</code></h4><p>Receives a message from a mailbox.</p></div>
    <div class="card mini"><h4><code>msg_rpc()</code></h4><p>Remote procedure call: sends a message and waits for exactly one reply.</p></div>
  </div>
  <ul>
    <li>When a task is created, two special mailboxes are created: <strong>Kernel</strong> (the kernel uses it to communicate with the task) and <strong>Notify</strong> (it receives notifications of events).</li>
    <li><code>port_allocate()</code> creates a new mailbox; the default maximum size of its queue is <strong>eight messages</strong>. The creating task is the owner and can receive messages from it.</li>
    <li>Messages from the same sender are queued in <strong>FIFO</strong> order (first in, first out), although ordering is not absolutely guaranteed between different senders.</li>
    <li>A message has a <strong>fixed-length header</strong> (with the length and two mailbox names: destination and “return address”) followed by <strong>variable-length data</strong> with type, size and value.</li>
  </ul>
  <details class="acc"><summary>If the destination mailbox is full, the sender has four options</summary><div class="body"><ol><li>Wait indefinitely until there is room.</li><li>Wait at most <em>n</em> milliseconds.</li><li>Do not wait at all and return immediately.</li><li>Temporarily cache the message with the operating system and be notified when it can be delivered. It is meant for server tasks, such as a printer driver.</li></ol></div></details>
  <details class="acc"><summary>How Mach avoids double copying of messages</summary><div class="body"><p>The main problem of message systems has been poor performance due to <strong>double copying</strong>: from the sender to the mailbox and from the mailbox to the receiver. Mach avoids it with virtual-memory techniques: it maps the address space containing the sender's message into the receiver's address space, so the message is never actually copied. It only works for messages within the same system.</p></div></details>

  <h2><span class="sn">7.3</span>Windows XP: local procedure call (LPC)</h2>
  <p>Windows XP supports several operating environments or <strong>subsystems</strong>, with which application programs (<em>clients</em>) communicate through message passing. That facility is called <strong>LPC</strong> (<em>local procedure call</em>) and connects two processes on the <strong>same machine</strong>. It resembles the standard RPC mechanism, but is optimized for Windows XP.</p>
  <p>Like Mach, it uses a <strong>port object</strong> to establish and maintain the connection. There are two types —<strong>connection</strong> ports and <strong>communication</strong> ports— which are really the same and only differ in name depending on use. Connection ports are objects visible to all processes.</p>
  <div class="fig" data-d="seq-lpc">
    <div class="fig-head"><b>Establishing an LPC channel</b><span>Step by step</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="grid2">
    <div class="card"><h3>Small messages</h3><p>The port's message queue is used as intermediate storage and the message is <strong>copied</strong> from one process to the other. It supports messages of up to <strong>256 bytes</strong>.</p></div>
    <div class="card"><h3>Large messages</h3><p>They are passed through a <strong>section object</strong>, which sets up a <strong>shared memory</strong> region. A short message with a pointer and the size of the section object is sent. It is more complicated, but avoids copying data.</p></div>
  </div>
  <p>In both cases a <strong>callback</strong> mechanism can be used if the client or the server cannot respond immediately, which allows asynchronous handling of messages.</p>
  <div class="callout dato"><span class="t">Detail</span><p>LPC is not part of the Win32 API and is therefore not visible to the programmer. Win32 applications invoke standard RPC; if the process is on the same system, the call is handled indirectly through an LPC.</p></div>

  <div class="key"><h3>Key ideas of the module</h3>
    <ul>
      <li>POSIX: <code>shmget</code> → <code>shmat</code> → use → <code>shmdt</code> → <code>shmctl</code>.</li>
      <li>Mach is entirely based on messages and ports; it avoids double copying with virtual memory.</li>
      <li>Windows XP combines both models: copying for small messages and shared memory for large ones.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Previous: Interprocess communication</button><button class="btn" data-next>Next: Client-server</button></div>
</section>

<section class="page" id="p8" data-title="Communication in client-server systems" data-short="Client-server">
  <span class="kicker">Module 8. Section 3.6 of the book</span>
  <h1 class="page-title">Communication in client-server systems</h1>
  <p class="lead">Shared memory and message passing are also useful in client-server systems. In addition, there are three specific strategies: <strong>sockets</strong>, <strong>remote procedure calls (RPC)</strong> and <strong>remote method invocation (RMI)</strong>.</p>

  <h2><span class="sn">8.1</span>Sockets</h2>
  <p>A <strong>socket</strong> is defined as an <strong>endpoint for communication</strong>. A pair of processes communicating over a network uses a pair of sockets, one for each process. A socket is identified by an <strong>IP address concatenated with a port number</strong>.</p>
  <p>Sockets use a client-server architecture: the server <strong>waits for requests</strong> by listening on a port and, when one arrives, accepts the connection from the client socket.</p>
  <div class="tw"><table style="min-width:420px">
    <thead><tr><th>Service</th><th>“Well-known” port</th></tr></thead>
    <tbody><tr><th>telnet</th><td>23</td></tr><tr><th>ftp</th><td>21</td></tr><tr><th>http (web server)</th><td>80</td></tr></tbody>
  </table></div>
  <p>All ports below 1024 are considered well known and are used for standard services. When a client initiates a connection, its computer assigns it an arbitrary port <strong>greater than 1024</strong>.</p>
  <div class="fig" data-d="seq-sock">
    <div class="fig-head"><b>Connection between a client and a web server</b><span>Step by step</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <h3>Sockets in Java</h3>
  <div class="grid3">
    <div class="card mini"><h4>TCP, connection-oriented</h4><p>Class <code>Socket</code>.</p></div>
    <div class="card mini"><h4>UDP, connectionless</h4><p>Class <code>DatagramSocket</code>.</p></div>
    <div class="card mini"><h4>Multicast</h4><p>Class <code>MulticastSocket</code> (subclass of <code>DatagramSocket</code>): sends data to several recipients.</p></div>
  </div>
  <p>The book illustrates a <strong>date server</strong>: it listens on port 6013 (it could be any port greater than 1024); the client connects to address <code>127.0.0.1</code>, the <strong>loopback address</strong>, by which a computer refers to itself. The server writes the date and time to the socket and closes it; the client reads it and closes its socket.</p>
<pre class="code"><span class="c">// Server: waits for connections and replies with the date</span>
ServerSocket sock = <span class="k">new</span> ServerSocket(6013);
<span class="k">while</span> (true) {
    Socket client = sock.<span class="f">accept</span>();          <span class="c">// blocks until a client arrives</span>
    PrintWriter pout = <span class="k">new</span> PrintWriter(client.<span class="f">getOutputStream</span>(), true);
    pout.<span class="f">println</span>(<span class="k">new</span> java.util.Date().<span class="f">toString</span>());
    client.<span class="f">close</span>();                          <span class="c">// goes back to listening</span>
}

<span class="c">// Client: connects, reads one line and closes</span>
Socket sock = <span class="k">new</span> Socket(<span class="s">"127.0.0.1"</span>, 6013);
BufferedReader bin = <span class="k">new</span> BufferedReader(<span class="k">new</span> InputStreamReader(sock.<span class="f">getInputStream</span>()));
System.out.<span class="f">println</span>(bin.<span class="f">readLine</span>());
sock.<span class="f">close</span>();</pre>
  <p class="src">Illustrative code, abbreviated and without exception handling, written for this OVA; it follows the logic of Figures 3.19 and 3.20 in the book.</p>
  <div class="callout ojo"><span class="t">Limitation</span><p>Sockets are a <strong>low-level</strong> form: they only allow the exchange of an <strong>unstructured stream of bytes</strong>. It is the responsibility of the client and server applications to impose a structure on the data. That is why RPC and RMI exist.</p></div>

  <h2><span class="sn">8.2</span>Remote procedure calls (RPC)</h2>
  <p>RPCs abstract the procedure-call mechanism for use between <strong>systems connected by a network</strong>. They are normally implemented on top of message passing, but, unlike IPC, the messages are <strong>well structured</strong>: each one is addressed to an <strong>RPC daemon</strong> listening on a port and contains the <strong>identifier of the function</strong> to execute and its <strong>parameters</strong>. The result comes back in a different message.</p>
  <p>A <strong>port</strong> is simply a number included at the start of the packet. A system usually has one network address but many ports to tell apart the services it offers.</p>
  <h3>Stubs and parameter marshalling</h3>
  <p>The client invokes the remote procedure <strong>as if it were local</strong>. The RPC system hides the details with a <strong>stub</strong> on the client side (normally one per remote procedure): it locates the server's port and <strong>marshals the parameters</strong> into a transmittable format. A similar stub on the server receives the message, unmarshals and invokes the procedure. Return values travel back the same way.</p>
  <div class="fig" data-d="seq-rpc">
    <div class="fig-head"><b>Execution of a remote procedure call</b><span>Step by step</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="grid3">
    <div class="card mini"><div class="ico c">⇄</div><h4>Data representation</h4><p>Client and server may represent integers differently: <em>big-endian</em> (most significant byte at the lower address) or <em>little-endian</em>. Many RPC systems define a machine-independent <strong>external data representation (XDR)</strong>: the client converts before sending and the server converts back.</p></div>
    <div class="card mini"><div class="ico c">1</div><h4>Call semantics</h4><p>Because of network errors, an RPC may fail or execute more than once. “<strong>At most once</strong>”: a timestamp is attached to each message and the server ignores repeats. “<strong>Exactly once</strong>”: in addition, the server confirms with an <strong>ACK</strong> message and the client periodically resends until it receives it.</p></div>
    <div class="card mini"><div class="ico c">⚓</div><h4>Port binding</h4><p>The client must know the server's port. Two methods: <strong>fixed addresses</strong> decided at compile time, or <strong>dynamic binding</strong> through a <em>rendezvous</em> daemon (<em>matchmaker</em>) on a fixed port.</p></div>
  </div>
  <div class="fig" data-d="seq-mm">
    <div class="fig-head"><b>Dynamic binding with the rendezvous daemon</b><span>Step by step</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <p>The dynamic method adds an initial request, but is more flexible than fixed ports. RPCs are very useful for implementing <strong>distributed file systems</strong>: messages are addressed to the server's file-system port and indicate the disk operation (read, write, rename, delete or status).</p>

  <h2><span class="sn">8.3</span>Remote method invocation (RMI)</h2>
  <p>RMI is a <strong>Java</strong> feature similar to RPC: it allows a thread to invoke a method on a <strong>remote object</strong>, that is, an object residing in a different Java virtual machine (JVM), on the same computer or on another one connected by a network. It is implemented with <strong>stubs</strong> (a proxy for the remote object, on the client) and <strong>skeletons</strong> (on the server).</p>
  <div class="fig" data-d="seq-rmi">
    <div class="fig-head"><b>Invocation <code style="background:transparent;color:#fff">server.someMethod(A, B)</code></b><span>Step by step</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="tw"><table>
    <thead><tr><th></th><th>RPC</th><th>RMI</th></tr></thead>
    <tbody>
      <tr><th>Paradigm</th><td><strong>Procedural</strong> programming: only remote procedures or functions can be called.</td><td><strong>Object</strong>-based: methods of remote objects are invoked.</td></tr>
      <tr><th>Parameters</th><td>Ordinary data structures.</td><td><strong>Objects</strong> can be passed as parameters.</td></tr>
    </tbody>
  </table></div>
  <h3>Parameter-passing rules</h3>
  <ul>
    <li><strong>Local</strong> (nonremote) objects are passed <strong>by copy</strong>, using <strong>object serialization</strong>. They must implement the <code>java.io.Serializable</code> interface.</li>
    <li><strong>Remote</strong> objects are passed <strong>by reference</strong>, so the server can invoke methods on them remotely.</li>
  </ul>

  <div class="key"><h3>Key ideas of the module</h3>
    <ul>
      <li>A socket is IP + port; it serves unstructured byte streams.</li>
      <li>RPC hides the network with stubs and parameter marshalling; its semantics must take care of duplicates.</li>
      <li>RMI is the object-oriented version of RPC in Java and allows passing objects.</li>
    </ul>
  </div>

</section>

<section class="page" id="p10" data-title="Chapter summary" data-short="Summary">
  <span class="kicker">Module 10. Section 3.7 of the book</span>
  <h1 class="page-title">Chapter summary</h1>
  <p class="lead">A process is a program in execution. As it executes it changes state, and the operating system represents it with its own process control block (PCB).</p>
  <div class="grid2">
    <div class="card mini"><h4>States and queues</h4><p>Each process is new, ready, running, waiting or terminated. When it is not running, it sits in a queue: an I/O request queue or the ready queue. The PCBs are linked to form the ready queue.</p></div>
    <div class="card mini"><h4>Scheduling</h4><p>Long-term (job) scheduling selects the processes allowed to compete for the CPU and depends heavily on resource allocation, especially memory. Short-term (CPU) scheduling picks a process from the ready queue.</p></div>
    <div class="card mini"><h4>Creation and termination</h4><p>The system provides a mechanism for parents to create children. The parent can wait for them to finish or run concurrently with them. Reasons for concurrency: information sharing, computation speedup, modularity and convenience.</p></div>
    <div class="card mini"><h4>Cooperation</h4><p>Processes can be independent or cooperating. The latter need interprocess communication: shared memory or message passing. They are not mutually exclusive and can be used at the same time.</p></div>
    <div class="card mini"><h4>Shared memory</h4><p>The processes share variables and communicate through them. Providing the communication is the responsibility of the application programmers; the operating system only provides the shared memory.</p></div>
    <div class="card mini"><h4>Message passing</h4><p>The processes exchange messages. Providing the communication mechanisms is the responsibility of the operating system itself.</p></div>
  </div>
  <div class="card" style="margin-top:6px"><h3>Client-server</h3><p>Communication can be based on <strong>sockets</strong> (a communication endpoint; each connection is a pair of sockets), on <strong>RPC</strong> (a process calls a procedure in a remote application) or on <strong>RMI</strong> (the Java version of RPC: it lets you invoke a method on a remote object). The main difference between RPC and RMI is that in RPC data is passed in an ordinary structure, while in RMI objects can be passed.</p></div>
  <div class="key"><h3>Take-aways</h3>
    <ul>
      <li>Process ≠ program: the process is an active entity with a program counter and resources.</li>
      <li>The PCB stores the context; the context switch saves and restores it.</li>
      <li>Communication between processes is solved with shared memory or messages, and between computers with sockets, RPC or RMI.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Previous: Timeline</button><button class="btn" data-next>Next: Glossary</button></div>
</section>

function render(i) {

function go(i) {

}
function fromHash() {

}

function closeMenu() { $('#sidebar').classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded', 'false'); }

    if (e.target.closest('[data-next]')) go(Math.min(current + 1, TOTAL - 1));
    if (e.target.closest('[data-prev]')) go(Math.max(current - 1, 0));

    if (e.key === 'Escape') closeMenu();

    if (['input', 'textarea', 'select'].includes(tag)) return;
    const arrows = e.key === 'ArrowRight' || e.key === 'ArrowLeft';
    if (!arrows) return;
    if (e.altKey || t === document.body || t.tagName === 'H1') {
      e.preventDefault();
      go(e.key === 'ArrowRight' ? Math.min(current + 1, TOTAL - 1) : Math.max(current - 1, 0));

  });
  document.addEventListener('click', e => {
    const lb = e.target.closest('[data-lang]');

  window.addEventListener('hashchange', fromHash);

        if (e.key === 'End') n = tabs.length - 1;

function buildTimeline() {
  const ol = $('#timeline');
  ol.innerHTML = TL.map((x, i) => `<li><span class="dot" aria-hidden="true">${i + 1}</span><div class="box"><button type="button" aria-expanded="false"><h4>${esc(x.t)}<em>${esc(x.e)}</em></h4></button><div class="more" hidden>${x.d}<p style="margin:.6em 0 0"><a href="#/${x.m}" data-go="${x.m}">${u('tlLink')(x.m)}</a></p></div></div></li>`).join('');
  $$('li', ol).forEach(li => {
    const b = $('button', li), more = $('.more', li);
    b.addEventListener('click', () => {
      const open = !li.classList.contains('open');
      li.classList.toggle('open', open); b.setAttribute('aria-expanded', open); more.hidden = !open;
    });
  });
  $('li button', ol).click();
}

/* ---------- Reproductores automáticos ---------- */
const players = new Set();
function stopAllPlayers() { players.forEach(p => p.stop()); }

/* ---------- Stepper genérico ---------- */
function stepper(fig, { n, render, captions, onNode }) {
  const bar = $('.stepbar', fig), cap = $('.caption', fig);
  let i = 0, timer = null;
  bar.innerHTML = `<button class="btn ghost" data-a="prev" type="button">${u('prev')}</button>
    <button class="btn" data-a="next" type="button">${u('next')}</button>
    <button class="btn ghost" data-a="play" type="button" aria-pressed="false">${u('play')}</button>
    <button class="btn ghost" data-a="reset" type="button">${u('reset')}</button>
    <span class="dots" role="group" aria-label="${u('stepsAria')}">${Array.from({ length: n }, (_, k) => `<i data-k="${k}" title="${u('stepTitle')(k + 1)}"></i>`).join('')}</span>
    <span class="count"></span>`;
  const bPrev = $('[data-a=prev]', bar), bNext = $('[data-a=next]', bar), bPlay = $('[data-a=play]', bar), bReset = $('[data-a=reset]', bar);
  const dots = $$('.dots i', bar), count = $('.count', bar);
  const set = k => {
    i = Math.max(0, Math.min(n - 1, k));
    render(i);
    cap.innerHTML = captions[i];
    dots.forEach((d, j) => { d.classList.toggle('done', j < i); d.classList.toggle('now', j === i); });
    count.textContent = u('stepCount')(i + 1, n);
    bPrev.disabled = i === 0; bNext.disabled = i === n - 1;
    if (i === n - 1) stop();
  };
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } bPlay.textContent = u('play'); bPlay.setAttribute('aria-pressed', 'false'); };
  const play = () => {
    if (i === n - 1) set(0);
    bPlay.textContent = u('pause'); bPlay.setAttribute('aria-pressed', 'true');
    timer = setInterval(() => set(i + 1), 3200);
  };
  bPrev.onclick = () => { stop(); set(i - 1); };
  bNext.onclick = () => { stop(); set(i + 1); };
  bPlay.onclick = () => timer ? stop() : play();
  bReset.onclick = () => { stop(); set(0); };
  dots.forEach(d => d.onclick = () => { stop(); set(+d.dataset.k); });
  const api = { set, stop, get i() { return i; } };
  players.add(api);
  set(0);
  return api;
}

/* ---------- Diagrama de secuencia ---------- */
function wrapText(s, max) {
  const words = s.split(' '); const lines = []; let cur = '';
  words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) lines.push(cur);
  return lines;
}
function seqBuild(cfg) {
  const W = 780, n = cfg.actors.length, m = n === 2 ? 150 : n === 3 ? 120 : 100;
  const xs = cfg.actors.map((_, i) => m + (W - 2 * m) * i / (n - 1));
  const gap = xs[1] - xs[0];
  const CW = 6.5; // ancho medio por carácter a 12.5px
  let y = 92; const blocks = [];
  cfg.steps.forEach((s, k) => {
    const ia = cfg.actors.findIndex(a => a.id === s.from), ib = cfg.actors.findIndex(a => a.id === s.to);
    if (s.t === 'msg') {
      const span = Math.abs(xs[ib] - xs[ia]);
      const lines = wrapText(s.label, Math.max(14, Math.floor((span - 18) / CW)));
      const arrowY = y + 16 + lines.length * 15 + 4;
      const x1 = xs[ia], x2 = xs[ib], dir = Math.sign(x2 - x1);
      let g = `<g class="stp" data-k="${k}">`;
      lines.forEach((l, j) => g += `<text x="${(x1 + x2) / 2}" y="${y + 14 + j * 15}">${esc(l)}</text>`);
      const a1 = s.bi ? x1 + dir * 8 : x1;
      g += `<line class="ln" x1="${a1}" y1="${arrowY}" x2="${x2 - dir * 8}" y2="${arrowY}"/>`;
      g += `<polygon class="hd" points="${x2},${arrowY} ${x2 - dir * 10},${arrowY - 5} ${x2 - dir * 10},${arrowY + 5}"/>`;
      if (s.bi) g += `<polygon class="hd" points="${x1},${arrowY} ${x1 + dir * 10},${arrowY - 5} ${x1 + dir * 10},${arrowY + 5}"/>`;
      g += `<text class="num" x="24" y="${arrowY + 4}">${k + 1}</text></g>`;
      blocks.push(g); y = arrowY + 18;
    } else {
      const w = ib >= 0 && ia >= 0 ? Math.min(Math.abs(xs[ib] - xs[ia]) + 150, W - 80) : Math.min(gap - 12, 300);
      let cx = ib >= 0 && ia >= 0 ? (xs[ia] + xs[ib]) / 2 : xs[ia];
      cx = Math.max(44 + w / 2, Math.min(W - 10 - w / 2, cx));
      const lines = wrapText(s.label, Math.floor((w - 20) / CW));
      const h = lines.length * 16 + 16;
      let g = `<g class="stp ${s.cls || ''}" data-k="${k}">`;
      g += `<rect class="nb" x="${cx - w / 2}" y="${y + 4}" width="${w}" height="${h}" rx="10"/>`;
      lines.forEach((l, j) => g += `<text x="${cx}" y="${y + 4 + 20 + j * 16 - 2}">${esc(l)}</text>`);
      g += `<text class="num" x="24" y="${y + 4 + h / 2 + 4}">${k + 1}</text></g>`;
      blocks.push(g); y += h + 20;
    }
  });
  const H = y + 10;
  const bw = n === 4 ? 150 : 170;
  let svg = `<svg class="sq" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria)}">`;
  cfg.actors.forEach((a, i) => {
    svg += `<line class="life" x1="${xs[i]}" y1="62" x2="${xs[i]}" y2="${H - 6}"/>`;
    svg += `<g class="actor"><rect x="${xs[i] - bw / 2}" y="10" width="${bw}" height="${a.sub ? 50 : 44}" rx="10"/><text x="${xs[i]}" y="${a.sub ? 31 : 38}">${esc(a.label)}</text>${a.sub ? `<text class="sub" x="${xs[i]}" y="48">${esc(a.sub)}</text>` : ''}</g>`;
  });
  svg += blocks.join('') + '</svg>';
  return svg;
}
function seq(fig, cfg) {
  const stage = $('.stage', fig);
  stage.innerHTML = seqBuild(cfg);
  const gs = $$('.stp', stage);
  stepper(fig, {
    n: cfg.steps.length,
    captions: cfg.steps.map(s => s.cap),
    render: i => { gs.forEach((g, k) => { g.classList.toggle('show', k <= i); g.classList.toggle('cur', k === i); }); if (cfg.onStep) cfg.onStep(i); }
  });
}

/* ---------- Marcadores y aristas SVG ---------- */
function mkDefs(id) {
  return `<defs>
    <marker id="mk${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db5a6" stroke="none"/></marker>
    <marker id="mo${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a7d38" stroke="none"/></marker>
  </defs>`;
}
function edge(id, name, d, label, lx, ly, anchor = 'middle') {
  return `<g class="ed" data-e="${name}"><path d="${d}" marker-end="url(#mk${id})"/><text x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(label)}</text></g>`;
}
function setEdges(root, id, active) {
  $$('.ed', root).forEach(g => {
    const on = active.includes(g.dataset.e);
    g.classList.toggle('on', on);
    $('path', g).setAttribute('marker-end', `url(#${on ? 'mo' : 'mk'}${id})`);
    $('path', g).classList.toggle('live', on);
  });
}

/* ---------- Búfer circular ---------- */
function buildRing(fig) {
  const N = 8, letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let buf = Array(N).fill(null), inn = 0, out = 0, next = 0;
  const stage = $('.stage', fig), stat = $('#ring-stat'), ctl = $('#ring-ctl'), cap = $('#ring-cap');
  const cw = 80, gap = 6, x0 = (780 - (N * cw + (N - 1) * gap)) / 2;
  let svg = `<svg viewBox="0 0 780 210" role="img" aria-label="Búfer circular de 8 posiciones con punteros in y out">`;
  for (let i = 0; i < N; i++) svg += `<g class="cell" data-i="${i}"><rect x="${x0 + i * (cw + gap)}" y="62" width="${cw}" height="64" rx="10"/><text class="v" x="${x0 + i * (cw + gap) + cw / 2}" y="108"></text><text class="i" x="${x0 + i * (cw + gap) + cw / 2}" y="79">[${i}]</text></g>`;
  svg += `<g class="ptr" id="pin"><polygon points="0,0 -10,-16 10,-16" fill="#0a7d38"/><text y="-22" fill="#0a7d38">in</text></g>`;
  svg += `<g class="ptr" id="pout"><polygon points="0,0 -10,16 10,16" fill="#0b7a90"/><text y="36" fill="#0b7a90">out</text></g>`;
  svg += `<text x="390" y="14" text-anchor="middle" style="font-size:13px;fill:#4b5b51">in → siguiente posición libre · out → primera posición ocupada</text></svg>`;
  stage.innerHTML = svg;
  ctl.innerHTML = `<button class="btn" type="button" data-a="p">${u('produce')}</button><button class="btn ghost" type="button" data-a="c">${u('consume')}</button><button class="btn ghost" type="button" data-a="r">${u('reset')}</button>`;
  const cells = $$('.cell', stage), pin = $('#pin', stage), pout = $('#pout', stage);
  const count = () => (inn - out + N) % N;
  const draw = () => {
    cells.forEach((c, i) => { c.classList.toggle('full', buf[i] !== null); $('.v', c).textContent = buf[i] || ''; });
    const px = i => x0 + i * (cw + gap) + cw / 2;
    pin.style.transform = `translate(${px(inn)}px,60px)`; pout.style.transform = `translate(${px(out)}px,128px)`;
    const full = ((inn + 1) % N) === out, empty = inn === out;
    stat.innerHTML = `<span class="chip">in = ${inn}</span><span class="chip">out = ${out}</span><span class="chip">${u('ringElems')} = ${count()}</span><span class="chip ${empty ? 'warn' : ''}">${empty ? u('ringEmpty') : u('ringNotEmpty')}</span><span class="chip ${full ? 'warn' : ''}">${full ? u('ringFull') : u('ringSpace')}</span>`;
    $('[data-a=p]', ctl).setAttribute('aria-disabled', full); $('[data-a=c]', ctl).setAttribute('aria-disabled', empty);
  };
  const act = {
    p() {
      if (((inn + 1) % N) === out) { cap.innerHTML = u('ringWaitP'); return; }
      const v = letters[next++ % 26]; buf[inn] = v; inn = (inn + 1) % N;
      cap.innerHTML = u('ringP')(v);
    },
    c() {
      if (inn === out) { cap.innerHTML = u('ringWaitC'); return; }
      const v = buf[out]; buf[out] = null; out = (out + 1) % N;
      cap.innerHTML = u('ringC')(v);
    },
    r() { buf = Array(N).fill(null); inn = out = 0; next = 0; cap.innerHTML = u('ringInit'); }
  };
  $$('button', ctl).forEach(b => b.addEventListener('click', () => { act[b.dataset.a](); draw(); }));
  draw();
}

function initDiagrams() {
  $$('[data-d]').forEach(fig => {
    const k = fig.dataset.d;
    if (k === 'state') buildState(fig);
    else if (k === 'queues') buildQueues(fig);
    else if (k === 'ring') buildRing(fig);
    else if (k.startsWith('seq-')) seq(fig, SEQ[k.slice(4)]);
    else if (STATIC[k]) STATIC[k](fig);
  });
}

function useData(lang) {
  snapshotES();
  const en = lang === 'en';
  MEM = en ? EN.MEM : ES0.MEM; CPUACT = en ? EN.CPUACT : ES0.CPUACT; PCB = en ? EN.PCB : ES0.PCB; TREE = en ? EN.TREE : ES0.TREE; TL = en ? EN.TL.map((x, i) => Object.assign({}, x, { m: ES0.TL[i].m })) : ES0.TL;
  GL = (en ? EN.GL : ES0.GL).slice().sort((a, b) => a[0].localeCompare(b[0], lang));
  Object.keys(ST).forEach(k => {
    if (en) { ST[k].label = EN.ST[k][0]; ST[k].info = EN.ST[k][1]; } else { ST[k].label = ES0.ST[k].label; ST[k].info = ES0.ST[k].info; }
  });
  STEPS.forEach((s, i) => { s.cap = (en && EN.STEPS[i]) ? EN.STEPS[i] : (i === 0 && en ? EN.ST.nuevo[1] : ES0.STEPS[i]); });
  QS.forEach((q, i) => { q.cap = en ? EN.QS[i] : ES0.QS[i]; });
  Object.keys(SEQ).forEach(k => {
    const s = SEQ[k], src = en ? EN.SEQ[k] : ES0.SEQ[k];
    s.aria = src.aria;
    s.actors.forEach((a, i) => { a.label = src.actors[i][0]; if (src.actors[i][1] !== undefined) a.sub = src.actors[i][1]; });
    s.steps.forEach((st, i) => { st.label = src.steps[i][0]; st.cap = src.steps[i][1]; });
  });
}

/* Traduce textos sueltos de los diagramas ya dibujados */
function trDom(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(t => {
    const s = t.nodeValue.trim();
    if (s && EN.MAP[s]) t.nodeValue = t.nodeValue.replace(s, EN.MAP[s]);
  });
  $$('[aria-label]', root).forEach(el => { const a = el.getAttribute('aria-label'); if (EN.AMAP[a]) el.setAttribute('aria-label', EN.AMAP[a]); });
}

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function buildGlossary() {
  const box = $('#gl'), q = $('#gl-q'), az = $('#gl-az'), cnt = $('#gl-count');
  let letter = '';
  const letters = [...new Set(GL.map(g => norm(g[0])[0].toUpperCase()))].sort();
  az.innerHTML = `<button type="button" data-l="" aria-pressed="true">${u('glAll')}</button>` + letters.map(l => `<button type="button" data-l="${l}" aria-pressed="false">${l}</button>`).join('');
  const draw = () => {
    const f = norm(q.value.trim());
    const list = GL.filter(g => (!letter || norm(g[0])[0].toUpperCase() === letter) && (!f || norm(g[0] + ' ' + g[1]).includes(f)));
    box.innerHTML = list.length ? list.map(g => `<article class="term"><h4>${esc(g[0])}</h4><p>${esc(g[1])}</p><button type="button" class="m" data-go="${g[2]}" style="all:unset;cursor:pointer;color:var(--cyan-d);font-weight:700;font-size:12px;margin-top:6px;display:inline-block;text-decoration:underline">${u('glMod')(g[2])}</button></article>`).join('') : `<div class="empty" style="grid-column:1/-1">${u('glEmpty')}</div>`;
    cnt.textContent = u('glCount')(list.length, GL.length);
  };
  q.addEventListener('input', draw);
  az.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    letter = b.dataset.l; $$('button', az).forEach(x => x.setAttribute('aria-pressed', x === b)); draw();
  });
  draw();
}

/* ---------- Arranque y cambio de idioma ---------- */
function applyShell() {
  document.documentElement.lang = u('htmlLang');
  document.title = u('title');
  $('.skip').textContent = u('skip');
  $('#menu-btn').textContent = u('menu');
  $('#nav').closest('nav').setAttribute('aria-label', u('navAria'));
  $('#sidebar').setAttribute('aria-label', u('sbAria'));
  $('.sb-ova b').textContent = u('ovaName');
  $('.sb-ova span').textContent = u('sbSub');
  ['f-fac', 'f-asig', 'f-doc', 'f-dev'].forEach((id, i) => { $('#' + id).textContent = u('foot')[i]; });
  $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
}
function mount(lang) {
  LANG = lang;
  useData(lang);
  const tpl = document.getElementById('tpl-' + lang);
  $('#main').innerHTML = tpl.innerHTML;
  pages = $$('.page'); TOTAL = pages.length;
  fillCover(); coverTable(); buildNav(); initTabs();
  pickList($('#mem'), $('#mem-detail'), [CPUACT, ...MEM], it => it.free ? '' : `<span>${it.name}</span><small>${it.small}</small>`);
  pickList($('#pcb'), $('#pcb-detail'), PCB, (it, k) => `<i>${String(k + 1).padStart(2, '0')}</i>${it.name}`);
  buildTree(); buildTimeline(); buildGlossary(); initDiagrams();
  if (lang === 'en') $$('.fig').forEach(trDom);
  applyShell();
}
function setLang(lang) {
  stopAllPlayers();
  const keep = current;
  mount(lang);
  try { localStorage.setItem('ova-proc-lang', lang); } catch (e) { /* ok */ }
  current = -1;
  render(keep < 0 ? 0 : keep);
}
document.addEventListener('DOMContentLoaded', () => {
  let lang = 'es';
  try { const s = localStorage.getItem('ova-proc-lang'); if (s === 'en' || s === 'es') lang = s; } catch (e) { /* ok */ }
  mount(lang); wireNav(); fromHash();
});

})();

<!-- =====================  2. EL PROCESO  ===================== -->
<section class="page" id="p2" data-title="El proceso" data-short="El proceso">
  <span class="kicker">Módulo 2. Sección 3.1 del libro</span>
  <h1 class="page-title">El concepto de proceso</h1>
  <p class="lead">Un <strong>proceso</strong> es un programa en ejecución. Es la unidad de trabajo de los sistemas modernos de tiempo compartido.</p>

  <h2><span class="sn">2.1</span>Por qué surgió el concepto</h2>
  <p>Los primeros sistemas informáticos permitían ejecutar un solo programa a la vez, que tenía el control completo del sistema y acceso a todos sus recursos. Los sistemas actuales cargan <strong>múltiples programas en memoria</strong> y los ejecutan de forma concurrente. Esa evolución exige más <strong>control y aislamiento</strong> entre programas, y de esa necesidad nació la noción de proceso.</p>
  <div class="grid2">
    <div class="card mini"><h4>Procesos del sistema operativo</h4><p>Ejecutan código del sistema: tareas que, por una u otra razón, no están dentro del kernel.</p></div>
    <div class="card mini"><h4>Procesos de usuario</h4><p>Ejecutan código de usuario: el navegador, el procesador de textos, el correo electrónico…</p></div>
  </div>
  <p>Potencialmente todos se ejecutan de forma concurrente, <strong>multiplexando la CPU</strong> (o las distintas CPU) entre ellos. Al cambiar la asignación de la CPU entre procesos, el sistema operativo incrementa la productividad de la computadora.</p>
  <div class="callout dato"><span class="t">Terminología</span><p>El libro usa «trabajo» y «proceso» de forma indistinta. «Trabajo» viene de la época de los sistemas por lotes y sigue presente en expresiones como <em>planificación de trabajos</em>. Aunque se prefiere «proceso», no se evita el otro término.</p></div>

  <h2><span class="sn">2.2</span>Qué contiene un proceso</h2>
  <p>Un proceso es <strong>más que el código</strong> del programa. Además incluye su actividad actual y varias áreas de memoria. Selecciona cada segmento para ver su función.</p>
  <div class="memwrap">
    <div>
      <div class="mem" id="mem" role="group" aria-label="Estructura de un proceso en memoria"></div>
      <div class="addr"><span>Direcciones altas ↑</span><span>↓ bajas</span></div>
    </div>
    <div class="detail" id="mem-detail" aria-live="polite"></div>
  </div>
  <p class="src"><b>Figura 3.1 del libro:</b> proceso en memoria (representación propia).</p>
  <div class="callout idea"><span class="t">Idea clave</span><p>La <strong>actividad actual</strong> de un proceso queda representada por el valor del <strong>contador de programa</strong> y por los contenidos de los <strong>registros del procesador</strong>.</p></div>

  <h2><span class="sn">2.3</span>Programa y proceso no son lo mismo</h2>
  <div class="tw"><table>
    <thead><tr><th></th><th>Programa</th><th>Proceso</th></tr></thead>
    <tbody>
      <tr><th>Naturaleza</th><td>Entidad <strong>pasiva</strong>.</td><td>Entidad <strong>activa</strong>.</td></tr>
      <tr><th>Qué es</th><td>Un archivo con una lista de instrucciones almacenado en disco (archivo ejecutable).</td><td>Un programa cargado en memoria, con contador de programa y recursos asociados.</td></tr>
      <tr><th>Siguiente instrucción</th><td>No aplica.</td><td>La indica el contador de programa.</td></tr>
      <tr><th>Cómo se origina</th><td>Se escribe y se compila.</td><td>Se crea cuando se carga el archivo ejecutable en memoria.</td></tr>
    </tbody>
  </table></div>
  <p>Un programa se convierte en proceso cuando se carga un archivo ejecutable en memoria. Dos formas habituales son <strong>hacer doble clic</strong> sobre el icono del archivo ejecutable o <strong>escribir su nombre en la línea de comandos</strong> (por ejemplo <code>prog.exe</code> o <code>a.out</code>).</p>
  <h3>Un mismo programa, varios procesos</h3>
  <p>Dos procesos pueden estar asociados con el mismo programa y aun así son <strong>secuencias de ejecución separadas</strong>. Varios usuarios pueden ejecutar copias del programa de correo, o un mismo usuario puede abrir muchas ventanas del navegador. La sección de texto es equivalente, pero las secciones de <strong>datos, cúmulo y pila varían</strong> de un proceso a otro.</p>
  <div class="fig" data-d="twoproc">
    <div class="fig-head"><b>Dos procesos del mismo programa</b><span>Ilustración</span></div>
    <div class="stage"></div>
    <p class="caption" style="min-height:0"><b>Lectura:</b> el código es el mismo, pero cada proceso tiene su propio contador de programa, su pila, sus datos y su cúmulo. Por eso uno puede ir por una instrucción distinta a la del otro.</p>
  </div>

  <h2><span class="sn">2.4</span>Hebras (introducción)</h2>
  <p>El modelo visto hasta ahora supone que un proceso es un programa con <strong>una sola hebra de ejecución</strong> (hilo, <em>thread</em>). Con una única hebra de control, el proceso realiza una tarea cada vez: por ejemplo, el usuario no puede escribir caracteres y a la vez ejecutar el corrector ortográfico dentro del mismo proceso.</p>
  <p>La mayoría de los sistemas operativos modernos extienden el concepto para que un proceso tenga <strong>múltiples hebras</strong>, que pueden ejecutar varias tareas a la vez. Esto resulta especialmente útil en sistemas con múltiples núcleos de procesamiento. Las hebras se estudian a fondo en el Capítulo 4 del libro.</p>

  <div class="key"><h3>Ideas clave del módulo</h3>
    <ul>
      <li>Un proceso es un <strong>programa en ejecución</strong>; un programa por sí solo es pasivo.</li>
      <li>Incluye código, contador de programa y registros, pila, sección de datos y cúmulo.</li>
      <li>Un mismo programa puede dar lugar a varios procesos independientes.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Anterior: Presentación</button><button class="btn" data-next>Siguiente: Estados y PCB</button></div>
</section>

<!-- =====================  3. ESTADOS Y PCB  ===================== -->
<section class="page" id="p3" data-title="Estados del proceso y PCB" data-short="Estados y PCB">
  <span class="kicker">Módulo 3. Secciones 3.1.2 y 3.1.3 del libro</span>
  <h1 class="page-title">Estados del proceso y bloque de control (PCB)</h1>
  <p class="lead">A medida que se ejecuta, un proceso cambia de estado. El sistema operativo lleva la cuenta de cada proceso mediante una estructura de datos propia: su bloque de control.</p>

  <h2><span class="sn">3.1</span>Los cinco estados</h2>
  <p>El estado de un proceso se define, en parte, por su <strong>actividad actual</strong>. Cada proceso puede estar en uno de estos estados:</p>
  <div class="grid3">
    <div class="card mini"><div class="ico">N</div><h4>Nuevo</h4><p>El proceso está siendo creado.</p></div>
    <div class="card mini"><div class="ico">P</div><h4>Preparado</h4><p>Está a la espera de que le asignen un procesador.</p></div>
    <div class="card mini"><div class="ico">E</div><h4>En ejecución</h4><p>Se están ejecutando sus instrucciones.</p></div>
    <div class="card mini"><div class="ico c">W</div><h4>En espera</h4><p>Espera a que ocurra un suceso, como la terminación de una operación de E/S o la recepción de una señal.</p></div>
    <div class="card mini"><div class="ico c">T</div><h4>Terminado</h4><p>Ha finalizado la ejecución del proceso.</p></div>
    <div class="card mini" style="background:var(--amber-bg);border-color:#efd18c"><h4 style="color:var(--amber)">Nombres arbitrarios</h4><p>Los nombres varían de un sistema operativo a otro, pero los estados que representan existen en todos. Algunos sistemas los definen de forma más específica.</p></div>
  </div>

  <h3>Diagrama de estados</h3>
  <p>Recorre un ciclo de vida típico o selecciona un estado en el diagrama para ver su descripción.</p>
  <div class="fig" data-d="state">
    <div class="fig-head"><b>Diagrama de estados de un proceso</b><span>Interactivo</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="hint">Consejo: puedes hacer clic sobre cualquier estado del diagrama.</p>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="callout ojo"><span class="t">Importante</span><p>En cualquier procesador, en un instante concreto, <strong>sólo puede haber un proceso en ejecución</strong>. Sin embargo, puede haber muchos procesos preparados y en espera.</p></div>

  <h2><span class="sn">3.2</span>El bloque de control de proceso (PCB)</h2>
  <p>Cada proceso se representa en el sistema operativo mediante un <strong>bloque de control de proceso</strong> (PCB, <em>process control block</em>), también llamado bloque de control de tarea. Contiene los elementos de información asociados a ese proceso específico. Selecciona cada campo:</p>
  <div class="memwrap">
    <div class="pcb" id="pcb" role="group" aria-label="Campos del bloque de control de proceso"></div>
    <div class="detail" id="pcb-detail" aria-live="polite"></div>
  </div>
  <p class="src"><b>Figura 3.3 del libro:</b> bloque de control de proceso (representación propia).</p>
  <div class="callout idea"><span class="t">En resumen</span><p>El PCB sirve simplemente como <strong>repositorio de cualquier información que pueda variar de un proceso a otro</strong>. Cuando se produce una interrupción, el estado de la CPU se guarda junto con el contador de programa para que el proceso pueda continuar correctamente después.</p></div>

  <div class="key"><h3>Ideas clave del módulo</h3>
    <ul>
      <li>Los estados son: nuevo, preparado, en ejecución, en espera y terminado.</li>
      <li>Un solo proceso por procesador puede estar en ejecución en un instante dado.</li>
      <li>El PCB guarda todo lo necesario para detener un proceso y reanudarlo más tarde.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Anterior: El proceso</button><button class="btn" data-next>Siguiente: Planificación</button></div>
</section>

<!-- =====================  4. PLANIFICACIÓN  ===================== -->
<section class="page" id="p4" data-title="Planificación de procesos" data-short="Planificación">
  <span class="kicker">Módulo 4. Sección 3.2 del libro</span>
  <h1 class="page-title">Planificación de procesos</h1>
  <p class="lead">El <strong>planificador de procesos</strong> selecciona un proceso disponible, entre varios, para ejecutarlo en la CPU. En un sistema de un solo procesador nunca habrá más de un proceso en ejecución: los demás esperan a que la CPU quede libre.</p>
  <div class="grid2">
    <div class="card mini"><h4>Objetivo de la multiprogramación</h4><p>Tener algún proceso en ejecución en todo momento para maximizar el uso de la CPU.</p></div>
    <div class="card mini"><h4>Objetivo del tiempo compartido</h4><p>Conmutar la CPU entre procesos con tanta frecuencia que los usuarios puedan interactuar con cada programa mientras se ejecuta.</p></div>
  </div>

  <h2><span class="sn">4.1</span>Colas de planificación</h2>
  <p>Durante su vida, los procesos se mueven entre varias colas:</p>
  <ul>
    <li><strong>Cola de trabajos:</strong> contiene todos los procesos del sistema.</li>
    <li><strong>Cola de procesos preparados:</strong> procesos que residen en memoria principal, listos y esperando ejecutarse. Suele ser una <em>lista enlazada</em>: la cabecera apunta al primer y último PCB y cada PCB tiene un puntero al siguiente.</li>
    <li><strong>Colas de dispositivo:</strong> procesos que esperan por un dispositivo de E/S concreto (por ejemplo un disco que está ocupado). Cada dispositivo tiene la suya.</li>
  </ul>
  <p>Un <strong>diagrama de colas</strong> representa la planificación: los rectángulos son colas, los círculos son los recursos que las atienden y las flechas indican el flujo de los procesos.</p>
  <div class="fig" data-d="queues">
    <div class="fig-head"><b>Diagrama de colas con cuatro procesos</b><span>Animación paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <h3>Qué puede ocurrirle a un proceso en la CPU</h3>
  <p>Cuando un proceso nuevo entra, espera en la cola de preparados hasta ser <strong>despachado</strong>. Una vez que se le asigna la CPU, puede ocurrir una de estas cosas:</p>
  <div class="grid3">
    <div class="card mini"><div class="ico">1</div><h4>Solicita E/S</h4><p>Pasa a una cola de E/S.</p></div>
    <div class="card mini"><div class="ico">2</div><h4>Crea un subproceso</h4><p>Espera a que éste termine.</p></div>
    <div class="card mini"><div class="ico">3</div><h4>Es desalojado</h4><p>Una interrupción lo devuelve a la cola de preparados.</p></div>
  </div>
  <p>En los dos primeros casos, el proceso pasará del estado de espera al estado preparado y volverá a la cola de preparados. El ciclo se repite hasta que el proceso termina; entonces se elimina de todas las colas y se liberan su PCB y sus recursos.</p>

  <h2><span class="sn">4.2</span>Planificadores</h2>
  <p>El sistema operativo selecciona procesos de las colas mediante un <strong>planificador</strong> apropiado. Hay tres niveles:</p>
  <div class="tw"><table>
    <thead><tr><th></th><th>Largo plazo<br><small>(de trabajos)</small></th><th>Corto plazo<br><small>(de la CPU)</small></th><th>Medio plazo</th></tr></thead>
    <tbody>
      <tr><th>Qué hace</th><td>Selecciona procesos de la cola de trabajos (en disco) y los carga en memoria para ejecutarlos.</td><td>Elige, entre los procesos preparados, el que recibe la CPU.</td><td>Saca procesos de memoria y los vuelve a cargar más tarde (<em>intercambio</em>).</td></tr>
      <tr><th>Frecuencia</th><td>Baja: pueden pasar minutos entre una ejecución y otra.</td><td>Alta: al menos una vez cada 100 ms, aproximadamente.</td><td>Intermedia; sólo en algunos sistemas.</td></tr>
      <tr><th>Exigencia</th><td>Puede tomarse más tiempo en decidir.</td><td>Debe ser muy rápido.</td><td>Mejora la mezcla de procesos o libera memoria.</td></tr>
      <tr><th>Controla</th><td>El <strong>grado de multiprogramación</strong> (número de procesos en memoria).</td><td>Qué proceso se ejecuta a continuación.</td><td>Reduce el grado de multiprogramación.</td></tr>
    </tbody>
  </table></div>
  <div class="callout dato"><span class="t">Un cálculo</span><p>Si el planificador a corto plazo tarda 10 ms en decidir y el proceso se ejecuta 100 ms, el tiempo perdido en planificar es 10 / (100 + 10) ≈ <strong>9 %</strong> del tiempo de CPU. Por eso debe ser rápido.</p></div>

  <h3>Procesos limitados por E/S y por CPU</h3>
  <p>La mayoría de los procesos se describen como una de estas dos clases:</p>
  <div class="fig" data-d="bursts">
    <div class="fig-head"><b>Perfil de uso de la CPU</b><span>Comparación</span></div>
    <div class="stage"></div>
    <p class="caption" style="min-height:0"><b>Lectura:</b> las barras verdes son tiempo de cómputo en la CPU; las grises, tiempo esperando operaciones de E/S.</p>
  </div>
  <p>Es importante que el planificador a largo plazo elija una <strong>mezcla equilibrada</strong>. Si todos los procesos fueran limitados por E/S, la cola de preparados estaría casi siempre vacía y el planificador a corto plazo tendría poco que hacer. Si todos fueran limitados por la CPU, la cola de espera de E/S estaría casi siempre vacía, los dispositivos apenas se usarían y el sistema también se desequilibraría.</p>
  <p>Algunos sistemas, como los de tiempo compartido UNIX y Microsoft Windows, a menudo no tienen planificador a largo plazo: ponen todos los procesos nuevos en memoria y los gestiona el planificador a corto plazo. Su estabilidad depende de una limitación física (como el número de terminales) o de la naturaleza autoajustable de los usuarios.</p>

  <h3>Planificación a medio plazo</h3>
  <p>A veces conviene <strong>sacar procesos de la memoria</strong>, reducir así el grado de multiprogramación y volver a cargarlos después, de modo que continúen donde se interrumpieron. Este esquema se denomina <strong>intercambio</strong> (<em>swapping</em>) y puede ser necesario para mejorar la mezcla de procesos o porque un cambio en las necesidades de memoria obligó a liberarla (se estudia en el Capítulo 8).</p>
  <div class="fig" data-d="swap">
    <div class="fig-head"><b>Intercambio con el planificador a medio plazo</b><span>Esquema</span></div>
    <div class="stage"></div>
  </div>

  <h2><span class="sn">4.3</span>Cambio de contexto</h2>
  <p>Cuando ocurre una interrupción, el sistema debe <strong>guardar el contexto</strong> del proceso que está en la CPU para poder restaurarlo después. El contexto se almacena en el PCB e incluye los registros de la CPU, el estado del proceso y la información de gestión de memoria. Cambiar la CPU a otro proceso exige guardar el estado del proceso actual y restaurar el de otro: esa tarea es el <strong>cambio de contexto</strong>.</p>
  <div class="fig" data-d="seq-ctx">
    <div class="fig-head"><b>Conmutación de la CPU entre dos procesos</b><span>Paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="grid2">
    <div class="callout ojo" style="margin:0"><span class="t">Costo</span><p>El tiempo dedicado al cambio de contexto es <strong>tiempo desperdiciado</strong>: durante la conmutación el sistema no realiza ningún trabajo útil. El libro cita velocidades del orden de unos pocos milisegundos, que varían según la máquina.</p></div>
    <div class="callout dato" style="margin:0"><span class="t">Hardware</span><p>Depende del soporte del procesador: algunos, como UltraSPARC, ofrecen varios conjuntos de registros, y el cambio consiste en cambiar un puntero. Si hay más procesos activos que conjuntos de registros, se vuelve a copiar a memoria.</p></div>
  </div>

  <div class="key"><h3>Ideas clave del módulo</h3>
    <ul>
      <li>Hay tres tipos de colas: de trabajos, de procesos preparados y de dispositivo.</li>
      <li>El planificador a largo plazo controla el grado de multiprogramación; el de corto plazo asigna la CPU.</li>
      <li>El cambio de contexto guarda y restaura el estado en los PCB y es tiempo no productivo.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Anterior: Estados y PCB</button><button class="btn" data-next>Siguiente: Operaciones</button></div>
</section>
<!-- =====================  5. OPERACIONES  ===================== -->
<section class="page" id="p5" data-title="Operaciones sobre los procesos" data-short="Operaciones">
  <span class="kicker">Módulo 5. Sección 3.3 del libro</span>
  <h1 class="page-title">Operaciones sobre los procesos</h1>
  <p class="lead">En la mayoría de los sistemas, los procesos se ejecutan de forma concurrente y pueden <strong>crearse y eliminarse dinámicamente</strong>. Por eso el sistema operativo debe ofrecer mecanismos para crear y terminar procesos.</p>

  <h2><span class="sn">5.1</span>Creación de procesos</h2>
  <p>Un proceso puede crear otros mediante una <strong>llamada al sistema</strong> específica. El proceso creador es el <strong>padre</strong> y los nuevos procesos son sus <strong>hijos</strong>. Cada hijo puede crear a su vez otros procesos, formando un <strong>árbol de procesos</strong>.</p>
  <p>La mayoría de los sistemas (UNIX y la familia Windows incluidas) identifican cada proceso con un <strong>identificador de proceso</strong> o <strong>pid</strong>, normalmente un entero único.</p>

  <h3>Ejemplo: árbol de procesos en Solaris</h3>
  <p>Selecciona un proceso para ver su papel. El libro presenta este árbol como ejemplo; aquí se reconstruye con los datos del texto.</p>
  <div class="treewrap">
    <ul class="tree" id="tree" aria-label="Árbol de procesos de Solaris"></ul>
    <div class="detail" id="tree-detail" aria-live="polite"></div>
  </div>
  <div class="callout dato"><span class="t">En UNIX</span><p>El comando <code>ps -el</code> lista información completa de todos los procesos activos. Es fácil construir un árbol como el anterior siguiendo recursivamente los procesos padre hasta llegar a <code>init</code>.</p></div>

  <h3>Recursos y ejecución del hijo</h3>
  <p>Un proceso necesita recursos (tiempo de CPU, memoria, archivos, dispositivos de E/S). Un subproceso puede obtenerlos <strong>directamente del sistema operativo</strong> o estar <strong>restringido a un subconjunto de los recursos del padre</strong>, lo que evita que un proceso sobrecargue el sistema creando demasiados subprocesos. El padre puede además pasar <strong>datos de inicialización</strong> al hijo (por ejemplo, el nombre de un archivo que debe mostrar).</p>
  <p>Al crearse un proceso existen dos pares de posibilidades:</p>
  <div class="grid2">
    <div class="card"><h3>En cuanto a la ejecución</h3><ol><li>El padre continúa ejecutándose <strong>concurrentemente</strong> con su hijo.</li><li>El padre <strong>espera</strong> hasta que alguno o todos sus hijos terminan.</li></ol></div>
    <div class="card"><h3>En cuanto al espacio de direcciones</h3><ol><li>El hijo es un <strong>duplicado</strong> del padre (mismo programa y datos).</li><li>El hijo <strong>carga un nuevo programa</strong>.</li></ol></div>
  </div>

  <h3>Creación en UNIX: fork(), exec() y wait()</h3>
  <ul>
    <li><code>fork()</code> crea un proceso nuevo cuyo espacio de direcciones es una <strong>copia</strong> del original. Padre e hijo continúan en la instrucción siguiente a <code>fork()</code>. Con una diferencia: el valor devuelto es <strong>0 en el hijo</strong> y el <strong>pid del hijo</strong> (distinto de cero) en el padre.</li>
    <li><code>exec()</code> (por ejemplo <code>execlp()</code>) carga un archivo binario en memoria, <strong>destruyendo la imagen anterior</strong>, e inicia su ejecución.</li>
    <li><code>wait()</code> permite al padre <strong>excluirse de la cola de preparados</strong> hasta que el hijo termine.</li>
  </ul>
  <div class="fig" data-d="seq-fork">
    <div class="fig-head"><b>Creación de un proceso en UNIX</b><span>Paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="cap-title">Esquema del programa (pseudocódigo en C, simplificado)</div>
<pre class="code" aria-label="Pseudocódigo de fork, exec y wait"><span class="ln" data-l="0">pid = <span class="f">fork</span>();                       <span class="c">/* crea el hijo */</span></span><span class="ln" data-l="1"><span class="k">if</span> (pid &lt; 0) {                        <span class="c">/* error: no se pudo crear */</span></span><span class="ln" data-l="1">    <span class="f">fprintf</span>(stderr, <span class="s">"Fallo en fork"</span>);</span><span class="ln" data-l="2">} <span class="k">else if</span> (pid == 0) {              <span class="c">/* camino del HIJO */</span></span><span class="ln" data-l="2">    <span class="f">execlp</span>(<span class="s">"/bin/ls"</span>, <span class="s">"ls"</span>, NULL);   <span class="c">/* reemplaza su imagen por ls */</span></span><span class="ln" data-l="3">} <span class="k">else</span> {                          <span class="c">/* camino del PADRE */</span></span><span class="ln" data-l="3">    <span class="f">wait</span>(NULL);                      <span class="c">/* espera a que el hijo termine */</span></span><span class="ln" data-l="4">    <span class="f">printf</span>(<span class="s">"Hijo completado"</span>);</span><span class="ln" data-l="4">}</span></pre>
  <p class="src">Código ilustrativo escrito para este OVA; sigue la lógica del ejemplo de la Figura 3.10 del libro.</p>

  <h3>Creación en Windows: CreateProcess()</h3>
  <p>En la API de Win32 los procesos se crean con <code>CreateProcess()</code>, parecida a <code>fork()</code> en que un padre crea un hijo, pero con diferencias importantes:</p>
  <div class="tw"><table>
    <thead><tr><th></th><th><code>fork()</code> (UNIX)</th><th><code>CreateProcess()</code> (Win32)</th></tr></thead>
    <tbody>
      <tr><th>Espacio de direcciones del hijo</th><td>Hereda el del padre (copia).</td><td>Se carga un programa específico durante la creación.</td></tr>
      <tr><th>Parámetros</th><td>Ninguno.</td><td>Al menos diez parámetros distintos.</td></tr>
      <tr><th>Esperar al hijo</th><td><code>wait()</code></td><td><code>WaitForSingleObject()</code>, pasándole el descriptor del proceso hijo.</td></tr>
    </tbody>
  </table></div>
  <p>Dos de los parámetros son estructuras: <code>STARTUPINFO</code> (propiedades del proceso nuevo, como el tamaño y la apariencia de la ventana y los archivos de entrada y salida estándar) y <code>PROCESS_INFORMATION</code> (descriptores e identificadores del proceso y de su hebra recién creados). En el ejemplo del libro, el hijo carga la aplicación <code>mspaint.exe</code>.</p>

  <h2><span class="sn">5.2</span>Terminación de procesos</h2>
  <p>Un proceso termina cuando ejecuta su última instrucción y pide al sistema operativo que lo elimine con la llamada <code>exit()</code>. En ese momento puede devolver un <strong>valor de estado</strong> (normalmente un entero) a su padre, a través de <code>wait()</code>. El sistema operativo <strong>libera todos los recursos</strong> del proceso: memoria física y virtual, archivos abiertos y búferes de E/S.</p>
  <p>Un proceso también puede provocar la terminación de otro con una llamada adecuada (por ejemplo <code>TerminateProcess()</code> en Win32). Normalmente sólo el <strong>padre</strong> puede hacerlo; si no, los usuarios podrían terminar arbitrariamente los trabajos de otros. Por eso el padre necesita conocer la identidad de sus hijos: al crear un proceso se le pasa el identificador del nuevo.</p>
  <h3>Por qué un padre termina a un hijo</h3>
  <div class="grid3">
    <div class="card mini"><div class="ico">1</div><h4>Exceso de recursos</h4><p>El hijo ha excedido el uso de algunos recursos asignados. El padre debe poder inspeccionar el estado de sus hijos.</p></div>
    <div class="card mini"><div class="ico">2</div><h4>Tarea innecesaria</h4><p>La tarea asignada al hijo ya no es necesaria.</p></div>
    <div class="card mini"><div class="ico">3</div><h4>El padre termina</h4><p>El padre abandona el sistema y el sistema operativo no permite que el hijo continúe.</p></div>
  </div>
  <h3>Qué ocurre con los hijos cuando el padre termina</h3>
  <div class="tabs" data-tabs>
    <div class="tablist" role="tablist"><button role="tab">Terminación en cascada</button><button role="tab">UNIX: adopción por init</button></div>
    <div class="tabpanel" role="tabpanel">
      <p>Algunos sistemas, como <strong>VMS</strong>, no permiten que un hijo siga existiendo si su padre terminó. Si un proceso termina (normal o anormalmente), <strong>todos sus hijos también deben terminar</strong>. Este fenómeno se llama <strong>terminación en cascada</strong> y normalmente lo inicia el sistema operativo.</p>
      <div class="fig" data-d="cascade" style="margin-bottom:0"><div class="stage"></div></div>
    </div>
    <div class="tabpanel" role="tabpanel">
      <p>En <strong>UNIX</strong>, si el padre termina, a todos sus hijos se les asigna el proceso <code>init</code> como <strong>nuevo padre</strong>. Así los hijos siguen teniendo un padre al que proporcionar su estado y sus estadísticas de ejecución.</p>
      <p><code>wait()</code> devuelve el identificador del hijo que terminó, de modo que el padre sabe cuál de sus muchos hijos ha concluido.</p>
      <div class="fig" data-d="adopt" style="margin-bottom:0"><div class="stage"></div></div>
    </div>
  </div>

  <div class="key"><h3>Ideas clave del módulo</h3>
    <ul>
      <li>Los procesos forman un árbol: cada uno tiene un padre y puede tener hijos, identificados por su pid.</li>
      <li>En UNIX, <code>fork()</code> duplica el proceso; <code>exec()</code> lo reemplaza por otro programa; <code>wait()</code> sincroniza al padre con el hijo.</li>
      <li>Al terminar, el sistema libera los recursos y el hijo devuelve su estado al padre.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Anterior: Planificación</button><button class="btn" data-next>Siguiente: Comunicación interprocesos</button></div>
</section>

<!-- =====================  6. IPC  ===================== -->
<section class="page" id="p6" data-title="Comunicación interprocesos" data-short="Comunicación interprocesos">
  <span class="kicker">Módulo 6. Sección 3.4 del libro</span>
  <h1 class="page-title">Comunicación interprocesos (IPC)</h1>
  <p class="lead">Los procesos que se ejecutan concurrentemente pueden ser <strong>independientes</strong> o <strong>cooperativos</strong>. Cuando cooperan, necesitan mecanismos para intercambiar datos e información.</p>

  <h2><span class="sn">6.1</span>Procesos independientes y cooperativos</h2>
  <div class="grid2">
    <div class="card"><h3>Independiente</h3><p>No puede afectar ni verse afectado por los demás procesos del sistema. Cualquier proceso que <strong>no comparte datos</strong> con otro es independiente.</p></div>
    <div class="card"><h3>Cooperativo</h3><p>Puede afectar o verse afectado por los demás. Cualquier proceso que <strong>comparte datos</strong> con otros es cooperativo.</p></div>
  </div>
  <h3>Razones para permitir la cooperación</h3>
  <div class="grid4">
    <div class="card mini"><div class="ico">1</div><h4>Compartir información</h4><p>Varios usuarios pueden querer la misma información (un archivo compartido): hace falta acceso concurrente.</p></div>
    <div class="card mini"><div class="ico">2</div><h4>Acelerar cálculos</h4><p>Dividir una tarea en subtareas en paralelo; sólo ayuda si hay múltiples CPU o canales de E/S.</p></div>
    <div class="card mini"><div class="ico c">3</div><h4>Modularidad</h4><p>Dividir las funciones del sistema en procesos o hebras separados.</p></div>
    <div class="card mini"><div class="ico c">4</div><h4>Conveniencia</h4><p>Un solo usuario puede editar, imprimir y compilar a la vez.</p></div>
  </div>

  <h2><span class="sn">6.2</span>Los dos modelos de comunicación</h2>
  <p>Hay dos modelos fundamentales: <strong>memoria compartida</strong> y <strong>paso de mensajes</strong>. Muchos sistemas operativos implementan ambos.</p>
  <div class="fig" data-d="models">
    <div class="fig-head"><b>Modelos de comunicación interprocesos</b><span>Comparación</span></div>
    <div class="stage"></div>
  </div>
  <div class="tw"><table>
    <thead><tr><th></th><th>Memoria compartida</th><th>Paso de mensajes</th></tr></thead>
    <tbody>
      <tr><th>Idea</th><td>Se establece una región de memoria compartida; los procesos leen y escriben en ella.</td><td>Los procesos intercambian mensajes mediante <code>send()</code> y <code>receive()</code>.</td></tr>
      <tr><th>Intervención del kernel</th><td>Sólo para establecer la región; después son accesos a memoria normales.</td><td>En cada intercambio, normalmente mediante llamadas al sistema.</td></tr>
      <tr><th>Velocidad</th><td>Máxima: se hace a velocidad de memoria dentro de una misma computadora.</td><td>Más lenta por la intervención del kernel.</td></tr>
      <tr><th>Cuándo conviene</th><td>Grandes cantidades de datos en una misma máquina.</td><td>Pocos datos (no hay que evitar conflictos) y comunicación entre computadoras; más fácil de implementar.</td></tr>
      <tr><th>Responsabilidad</th><td>De los procesos: formato, ubicación y evitar escrituras simultáneas.</td><td>Del sistema operativo.</td></tr>
    </tbody>
  </table></div>

  <h2><span class="sn">6.3</span>Sistemas de memoria compartida</h2>
  <p>Una región de memoria compartida suele residir en el espacio de direcciones del proceso que crea el segmento. Los demás procesos que quieran usarla deben <strong>conectarse</strong> a ese espacio. Normalmente el sistema impide que un proceso acceda a la memoria de otro; la memoria compartida exige que los procesos <strong>acuerden eliminar esa restricción</strong>.</p>
  <h3>El problema del productor-consumidor</h3>
  <p>Es un paradigma muy usado para los procesos cooperativos: un <strong>productor</strong> genera información que consume un <strong>consumidor</strong>. Por ejemplo, un compilador genera código ensamblador que consume un ensamblador, y éste genera módulos objeto que consume el cargador. También es una metáfora del modelo cliente-servidor: el servidor produce (por ejemplo, archivos HTML) y el cliente consume (el navegador).</p>
  <p>Una solución usa un <strong>búfer</strong> en memoria compartida que el productor llena y el consumidor vacía. Deben estar sincronizados para que el consumidor no intente consumir lo que aún no se produjo.</p>
  <div class="grid2">
    <div class="card mini"><h4>Búfer no limitado</h4><p>Sin límite de tamaño. El consumidor puede tener que esperar elementos nuevos, pero el productor siempre puede producir.</p></div>
    <div class="card mini"><h4>Búfer limitado</h4><p>Tamaño fijo. El consumidor espera si el búfer está vacío y el productor espera si está lleno.</p></div>
  </div>
  <p>En el esquema del libro el búfer es una <strong>matriz circular</strong> con dos punteros lógicos: <code>in</code> (siguiente posición libre) y <code>out</code> (primera posición ocupada). Prueba el funcionamiento:</p>
  <div class="fig" data-d="ring">
    <div class="fig-head"><b>Búfer circular compartido (tamaño 8)</b><span>Demostración</span></div>
    <div class="stage"></div>
    <div class="ring-stat" id="ring-stat"></div>
    <div class="stepbar" id="ring-ctl"></div>
    <p class="caption" id="ring-cap" aria-live="polite">Pulsa «Producir» para añadir un elemento o «Consumir» para retirarlo.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Condición</th><th>Expresión</th></tr></thead>
    <tbody>
      <tr><th>Búfer vacío</th><td><code>in == out</code></td></tr>
      <tr><th>Búfer lleno</th><td><code>((in + 1) % BUFFER_SIZE) == out</code></td></tr>
    </tbody>
  </table></div>
  <div class="cap-title">Productor y consumidor (esquema simplificado)</div>
<pre class="code"><span class="c">/* Productor */</span>
<span class="k">while</span> (true) {
    <span class="c">/* produce un elemento en nextProduced */</span>
    <span class="k">while</span> (((in + 1) % BUFFER_SIZE) == out)
        ;                                  <span class="c">/* búfer lleno: no hacer nada */</span>
    buffer[in] = nextProduced;
    in = (in + 1) % BUFFER_SIZE;
}

<span class="c">/* Consumidor */</span>
<span class="k">while</span> (true) {
    <span class="k">while</span> (in == out)
        ;                                  <span class="c">/* búfer vacío: no hacer nada */</span>
    nextConsumed = buffer[out];
    out = (out + 1) % BUFFER_SIZE;
    <span class="c">/* consume el elemento de nextConsumed */</span>
}</pre>
  <p class="src">Código ilustrativo escrito para este OVA; sigue la lógica de las Figuras 3.14 y 3.15 del libro.</p>
  <div class="callout ojo"><span class="t">Limitaciones</span><p>Este esquema permite como máximo <strong>BUFFER_SIZE − 1</strong> elementos a la vez. Tampoco resuelve qué ocurre cuando productor y consumidor acceden al búfer de forma <em>concurrente</em>: la sincronización se estudia en el Capítulo 6 del libro.</p></div>

  <h2><span class="sn">6.4</span>Sistemas de paso de mensajes</h2>
  <p>El paso de mensajes permite que los procesos se <strong>comuniquen y sincronicen sus acciones sin compartir el mismo espacio de direcciones</strong>. Es especialmente útil en entornos distribuidos, donde los procesos residen en computadoras distintas conectadas en red (por ejemplo, un programa de chat).</p>
  <p>Ofrece al menos dos operaciones: <code>send(mensaje)</code> y <code>receive(mensaje)</code>. Los mensajes pueden ser de tamaño <strong>fijo</strong> (implementación sencilla, programación más difícil) o <strong>variable</strong> (implementación más compleja, programación más sencilla): un compromiso habitual en el diseño de sistemas operativos.</p>
  <p>Si los procesos P y Q desean comunicarse, debe existir un <strong>enlace de comunicaciones</strong> entre ellos. El libro se centra en su implementación lógica, que se decide en tres aspectos:</p>

  <div class="tabs" data-tabs>
    <div class="tablist" role="tablist"><button role="tab">Nombrado</button><button role="tab">Sincronización</button><button role="tab">Almacenamiento en búfer</button></div>

    <div class="tabpanel" role="tabpanel">
      <p>Los procesos necesitan un modo de referenciarse entre sí: comunicación <strong>directa</strong> o <strong>indirecta</strong>.</p>
      <div class="fig" data-d="naming" style="box-shadow:none"><div class="stage"></div></div>
      <div class="tw"><table>
        <thead><tr><th></th><th>Directa (simétrica)</th><th>Directa (asimétrica)</th><th>Indirecta (buzones)</th></tr></thead>
        <tbody>
          <tr><th>Primitivas</th><td><code>send(P, msj)</code><br><code>receive(Q, msj)</code></td><td><code>send(P, msj)</code><br><code>receive(id, msj)</code></td><td><code>send(A, msj)</code><br><code>receive(A, msj)</code></td></tr>
          <tr><th>Quién nombra a quién</th><td>Emisor y receptor se nombran mutuamente.</td><td>Sólo el emisor nombra al receptor; <code>id</code> recibe el nombre del emisor.</td><td>Ambos nombran un buzón (o puerto).</td></tr>
          <tr><th>Enlace</th><td>Exactamente dos procesos; un enlace por pareja; se establece automáticamente.</td><td>Igual que la simétrica.</td><td>Sólo si comparten buzón; puede asociarse a más de dos procesos; puede haber varios enlaces entre una pareja.</td></tr>
          <tr><th>Desventaja</th><td colspan="2">Poca modularidad: cambiar un identificador obliga a modificar todas las definiciones que lo usan (precodificación).</td><td>—</td></tr>
        </tbody>
      </table></div>
      <h3>Propiedad de un buzón</h3>
      <ul>
        <li>Si es <strong>propiedad de un proceso</strong> (parte de su espacio de direcciones), el propietario sólo recibe y los usuarios sólo envían. Cuando el propietario termina, el buzón desaparece y debe notificarse a quien le escriba después.</li>
        <li>Si es <strong>propiedad del sistema operativo</strong>, tiene existencia propia: el sistema permite crearlo, enviar y recibir, y eliminarlo. Por omisión el creador es su propietario y la propiedad puede transferirse.</li>
      </ul>
      <p>Si varios procesos comparten un buzón y más de uno intenta recibir, el destinatario del mensaje depende de la política elegida: limitar cada enlace a dos procesos, permitir sólo un receptor a la vez, o dejar que el sistema elija (arbitrariamente o por turnos).</p>
    </div>

    <div class="tabpanel" role="tabpanel">
      <p>El paso de mensajes puede ser con <strong>bloqueo</strong> (síncrono) o <strong>sin bloqueo</strong> (asíncrono).</p>
      <div class="grid2">
        <div class="card mini"><h4>Envío con bloqueo</h4><p>El emisor se bloquea hasta que el receptor o el buzón reciben el mensaje.</p></div>
        <div class="card mini"><h4>Envío sin bloqueo</h4><p>El emisor envía el mensaje y continúa operando.</p></div>
        <div class="card mini"><h4>Recepción con bloqueo</h4><p>El receptor se bloquea hasta que hay un mensaje disponible.</p></div>
        <div class="card mini"><h4>Recepción sin bloqueo</h4><p>El receptor obtiene un mensaje válido o un mensaje nulo.</p></div>
      </div>
      <p>Cuando <code>send()</code> y <code>receive()</code> son ambos con bloqueo se produce un <strong>rendezvous</strong> entre emisor y receptor. Con ellos, la solución del problema productor-consumidor es trivial.</p>
      <div class="fig" data-d="seq-rdv" style="box-shadow:none">
        <div class="fig-head"><b>Rendezvous: envío y recepción con bloqueo</b><span>Paso a paso</span></div>
        <div class="stage"></div><div class="stepbar"></div>
        <p class="caption" aria-live="polite"></p>
      </div>
    </div>

    <div class="tabpanel" role="tabpanel">
      <p>Los mensajes intercambiados residen en una <strong>cola temporal</strong>, tanto en comunicación directa como indirecta. Se implementa de tres maneras:</p>
      <div class="grid3">
        <div class="card mini"><div class="ico">0</div><h4>Capacidad cero</h4><p>La cola tiene longitud máxima cero; ningún mensaje puede esperar en el enlace. El emisor se bloquea hasta que el receptor recibe el mensaje.</p></div>
        <div class="card mini"><div class="ico">n</div><h4>Capacidad limitada</h4><p>Longitud finita <em>n</em>. Si no está llena, el mensaje entra y el emisor continúa; si está llena, el emisor se bloquea hasta que haya espacio.</p></div>
        <div class="card mini"><div class="ico">∞</div><h4>Capacidad ilimitada</h4><p>Longitud potencialmente infinita; el emisor nunca se bloquea.</p></div>
      </div>
      <p class="src">La capacidad cero se conoce como sistema de mensajes <strong>sin almacenamiento en búfer</strong>; los otros casos, como sistemas con <strong>almacenamiento en búfer automático</strong>.</p>
      <div class="fig" data-d="buffers" style="box-shadow:none"><div class="stage"></div></div>
    </div>
  </div>

  <div class="key"><h3>Ideas clave del módulo</h3>
    <ul>
      <li>Los procesos cooperativos necesitan IPC: memoria compartida o paso de mensajes.</li>
      <li>La memoria compartida es más rápida; el paso de mensajes es más sencillo y sirve entre computadoras.</li>
      <li>El diseño del paso de mensajes se define en tres ejes: nombrado, sincronización y almacenamiento en búfer.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Anterior: Operaciones</button><button class="btn" data-next>Siguiente: Ejemplos de IPC</button></div>
</section>

<!-- =====================  7. EJEMPLOS IPC  ===================== -->
<section class="page" id="p7" data-title="Ejemplos de sistemas IPC" data-short="Ejemplos de IPC">
  <span class="kicker">Módulo 7. Sección 3.5 del libro</span>
  <h1 class="page-title">Ejemplos de sistemas IPC</h1>
  <p class="lead">El libro analiza tres sistemas reales: la <strong>API de POSIX</strong> para memoria compartida, el paso de mensajes del sistema operativo <strong>Mach</strong> y la facilidad de <strong>Windows XP</strong>, que usa memoria compartida para ofrecer paso de mensajes.</p>

  <h2><span class="sn">7.1</span>Memoria compartida en POSIX</h2>
  <p>Los sistemas POSIX ofrecen varios mecanismos IPC, entre ellos memoria compartida y paso de mensajes. El uso de la memoria compartida sigue cinco llamadas al sistema:</p>
  <div class="grid2">
    <div class="card mini"><h4><code>shmget()</code> — crear</h4><p>Crea el segmento (<em>Shared Memory GET</em>). Recibe la clave (<code>IPC_PRIVATE</code> crea uno nuevo), el tamaño en bytes y el modo de uso (lectura, escritura o ambos). Devuelve un identificador entero.</p></div>
    <div class="card mini"><h4><code>shmat()</code> — conectar</h4><p>Asocia el segmento al espacio de direcciones (<em>Shared Memory ATtach</em>). Recibe el identificador, la ubicación deseada (<code>NULL</code>: elige el sistema) y un indicador de modo (0: lectura y escritura). Devuelve un puntero.</p></div>
    <div class="card mini"><h4>Acceso normal</h4><p>Con el puntero devuelto se lee y escribe como en cualquier acceso a memoria; el kernel ya no interviene. Los demás procesos conectados ven las actualizaciones.</p></div>
    <div class="card mini"><h4><code>shmdt()</code> y <code>shmctl()</code></h4><p><code>shmdt()</code> desconecta el segmento del espacio de direcciones. <code>shmctl()</code> con <code>IPC_RMID</code> lo elimina del sistema.</p></div>
  </div>
  <div class="fig" data-d="seq-shm">
    <div class="fig-head"><b>Ciclo de vida de un segmento de memoria compartida</b><span>Paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
<pre class="code" aria-label="Fragmento de memoria compartida POSIX"><span class="c">/* crear un segmento de 4096 bytes, sólo accesible por su propietario */</span>
segment_id = <span class="f">shmget</span>(IPC_PRIVATE, 4096, S_IRUSR | S_IWUSR);

<span class="c">/* conectarlo al espacio de direcciones */</span>
shared_memory = (<span class="k">char</span> *) <span class="f">shmat</span>(segment_id, NULL, 0);

<span class="f">sprintf</span>(shared_memory, <span class="s">"¡Hola!"</span>);   <span class="c">/* escribir como en memoria normal */</span>
<span class="f">printf</span>(<span class="s">"%s\n"</span>, shared_memory);

<span class="f">shmdt</span>(shared_memory);                  <span class="c">/* desconectar */</span>
<span class="f">shmctl</span>(segment_id, IPC_RMID, NULL);   <span class="c">/* eliminar el segmento */</span></pre>
  <p class="src">Código ilustrativo escrito para este OVA; sigue la lógica del programa de la Figura 3.16 del libro.</p>

  <h2><span class="sn">7.2</span>Mach: sistema basado en mensajes</h2>
  <p>Mach, desarrollado en la Universidad Carnegie Mellon, forma parte de Mac OS X. Su kernel permite crear y destruir múltiples <strong>tareas</strong>, similares a los procesos pero con múltiples hebras de control. <strong>Casi toda la comunicación</strong> —incluidas la mayoría de las llamadas al sistema y toda la comunicación entre tareas— se hace mediante <strong>mensajes</strong>, que se envían y reciben por <strong>buzones llamados puertos</strong>.</p>
  <div class="grid3">
    <div class="card mini"><h4><code>msg_send()</code></h4><p>Envía un mensaje a un buzón.</p></div>
    <div class="card mini"><h4><code>msg_receive()</code></h4><p>Recibe un mensaje de un buzón.</p></div>
    <div class="card mini"><h4><code>msg_rpc()</code></h4><p>Llamada a procedimiento remoto: envía un mensaje y espera exactamente una respuesta.</p></div>
  </div>
  <ul>
    <li>Al crearse una tarea se crean dos buzones especiales: <strong>Kernel</strong> (el kernel se comunica con la tarea por él) y <strong>Notify</strong> (recibe las notificaciones de sucesos).</li>
    <li><code>port_allocate()</code> crea un buzón nuevo; el tamaño máximo predeterminado de su cola es de <strong>ocho mensajes</strong>. La tarea creadora es la propietaria y puede recibir mensajes de él.</li>
    <li>Los mensajes de un mismo emisor se encolan en orden <strong>FIFO</strong> (primero en entrar, primero en salir), aunque el orden no está garantizado de forma absoluta entre emisores distintos.</li>
    <li>Un mensaje tiene una <strong>cabecera de longitud fija</strong> (con la longitud y dos nombres de buzón: destino y «dirección de retorno») seguida de <strong>datos de longitud variable</strong> con tipo, tamaño y valor.</li>
  </ul>
  <details class="acc"><summary>Si el buzón de destino está lleno, el emisor tiene cuatro opciones</summary><div class="body"><ol><li>Esperar indefinidamente hasta que haya espacio.</li><li>Esperar como máximo <em>n</em> milisegundos.</li><li>No esperar nada y volver inmediatamente.</li><li>Almacenar el mensaje temporalmente en caché del sistema operativo y recibir un aviso cuando pueda entregarse. Está pensada para tareas de servidor, como un controlador de impresora.</li></ol></div></details>
  <details class="acc"><summary>Cómo evita Mach la doble copia de mensajes</summary><div class="body"><p>El principal problema de los sistemas de mensajes ha sido el bajo rendimiento por la <strong>doble copia</strong>: del emisor al buzón y del buzón al receptor. Mach la evita con técnicas de memoria virtual: asigna el espacio de direcciones que contiene el mensaje del emisor al espacio de direcciones del receptor, de modo que el mensaje nunca se copia realmente. Sólo funciona para mensajes dentro del mismo sistema.</p></div></details>

  <h2><span class="sn">7.3</span>Windows XP: llamada a procedimiento local (LPC)</h2>
  <p>Windows XP soporta varios entornos operativos o <strong>subsistemas</strong>, con los que los programas de aplicación (<em>clientes</em>) se comunican mediante paso de mensajes. Esa facilidad se llama <strong>LPC</strong> (<em>local procedure call</em>) y comunica dos procesos de la <strong>misma máquina</strong>. Se parece al mecanismo estándar RPC, pero está optimizada para Windows XP.</p>
  <p>Como Mach, usa un <strong>objeto puerto</strong> para establecer y mantener la conexión. Hay dos tipos —puertos de <strong>conexión</strong> y de <strong>comunicación</strong>— que son realmente iguales y sólo cambian de nombre según su uso. Los puertos de conexión son objetos visibles para todos los procesos.</p>
  <div class="fig" data-d="seq-lpc">
    <div class="fig-head"><b>Establecimiento de un canal LPC</b><span>Paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="grid2">
    <div class="card"><h3>Mensajes pequeños</h3><p>Se usa la cola de mensajes del puerto como almacenamiento intermedio y se <strong>copia</strong> el mensaje de un proceso a otro. Admite mensajes de hasta <strong>256 bytes</strong>.</p></div>
    <div class="card"><h3>Mensajes grandes</h3><p>Se pasan mediante un <strong>objeto sección</strong>, que configura una región de <strong>memoria compartida</strong>. Se envía un mensaje corto con un puntero y el tamaño del objeto sección. Es más complicado, pero evita copiar datos.</p></div>
  </div>
  <p>En ambos casos puede usarse un mecanismo de <strong>retrollamada</strong> si el cliente o el servidor no pueden responder de inmediato, lo que permite un tratamiento asíncrono de los mensajes.</p>
  <div class="callout dato"><span class="t">Detalle</span><p>LPC no forma parte de la API de Win32 y, por tanto, no es visible para el programador. Las aplicaciones Win32 invocan RPC estándar; si el proceso está en el mismo sistema, la llamada se gestiona indirectamente mediante una LPC.</p></div>

  <div class="key"><h3>Ideas clave del módulo</h3>
    <ul>
      <li>POSIX: <code>shmget</code> → <code>shmat</code> → uso → <code>shmdt</code> → <code>shmctl</code>.</li>
      <li>Mach se basa por completo en mensajes y puertos; evita la doble copia con memoria virtual.</li>
      <li>Windows XP combina ambos modelos: copia en mensajes pequeños y memoria compartida en los grandes.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Anterior: Comunicación interprocesos</button><button class="btn" data-next>Siguiente: Cliente-servidor</button></div>
</section>

<!-- =====================  8. CLIENTE-SERVIDOR  ===================== -->
<section class="page" id="p8" data-title="Comunicación en sistemas cliente-servidor" data-short="Cliente-servidor">
  <span class="kicker">Módulo 8. Sección 3.6 del libro</span>
  <h1 class="page-title">Comunicación en sistemas cliente-servidor</h1>
  <p class="lead">La memoria compartida y el paso de mensajes también sirven en sistemas cliente-servidor. Además existen tres estrategias específicas: <strong>sockets</strong>, <strong>llamadas a procedimientos remotos (RPC)</strong> e <strong>invocación de métodos remotos (RMI)</strong>.</p>

  <h2><span class="sn">8.1</span>Sockets</h2>
  <p>Un <strong>socket</strong> es un <strong>punto terminal de una comunicación</strong>. Una pareja de procesos que se comunican por red usa una pareja de sockets, uno por proceso. Cada socket se identifica mediante una <strong>dirección IP concatenada con un número de puerto</strong>.</p>
  <p>Los sockets usan una arquitectura cliente-servidor: el servidor <strong>espera solicitudes</strong> poniéndose a la escucha en un puerto y, al recibir una, acepta la conexión del socket cliente.</p>
  <div class="tw"><table style="min-width:420px">
    <thead><tr><th>Servicio</th><th>Puerto «bien conocido»</th></tr></thead>
    <tbody><tr><th>telnet</th><td>23</td></tr><tr><th>ftp</th><td>21</td></tr><tr><th>http (servidor web)</th><td>80</td></tr></tbody>
  </table></div>
  <p>Todos los puertos por debajo de 1024 se consideran bien conocidos y se usan para servicios estándar. Cuando un cliente inicia una conexión, su computadora le asigna un puerto arbitrario <strong>mayor que 1024</strong>.</p>
  <div class="fig" data-d="seq-sock">
    <div class="fig-head"><b>Conexión entre un cliente y un servidor web</b><span>Paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <h3>Sockets en Java</h3>
  <div class="grid3">
    <div class="card mini"><h4>TCP, orientado a conexión</h4><p>Clase <code>Socket</code>.</p></div>
    <div class="card mini"><h4>UDP, sin conexión</h4><p>Clase <code>DatagramSocket</code>.</p></div>
    <div class="card mini"><h4>Multidifusión</h4><p>Clase <code>MulticastSocket</code> (subclase de <code>DatagramSocket</code>): envía datos a varios receptores.</p></div>
  </div>
  <p>El libro ilustra un <strong>servidor horario</strong>: escucha en el puerto 6013 (puede ser cualquiera mayor que 1024); el cliente se conecta a la dirección <code>127.0.0.1</code>, la <strong>dirección de bucle</strong> (<em>loopback</em>), con la que una computadora se refiere a sí misma. El servidor escribe la fecha y hora en el socket y lo cierra; el cliente la lee y cierra su socket.</p>
<pre class="code"><span class="c">// Servidor: espera conexiones y responde con la fecha</span>
ServerSocket sock = <span class="k">new</span> ServerSocket(6013);
<span class="k">while</span> (true) {
    Socket client = sock.<span class="f">accept</span>();          <span class="c">// se bloquea hasta que llega un cliente</span>
    PrintWriter pout = <span class="k">new</span> PrintWriter(client.<span class="f">getOutputStream</span>(), true);
    pout.<span class="f">println</span>(<span class="k">new</span> java.util.Date().<span class="f">toString</span>());
    client.<span class="f">close</span>();                          <span class="c">// vuelve a escuchar</span>
}

<span class="c">// Cliente: se conecta, lee una línea y cierra</span>
Socket sock = <span class="k">new</span> Socket(<span class="s">"127.0.0.1"</span>, 6013);
BufferedReader bin = <span class="k">new</span> BufferedReader(<span class="k">new</span> InputStreamReader(sock.<span class="f">getInputStream</span>()));
System.out.<span class="f">println</span>(bin.<span class="f">readLine</span>());
sock.<span class="f">close</span>();</pre>
  <p class="src">Código ilustrativo, abreviado y sin manejo de excepciones, escrito para este OVA; sigue la lógica de las Figuras 3.19 y 3.20 del libro.</p>
  <div class="callout ojo"><span class="t">Limitación</span><p>Los sockets son una forma de <strong>bajo nivel</strong>: sólo permiten intercambiar un <strong>flujo no estructurado de bytes</strong>. Es responsabilidad de la aplicación cliente y de la servidora imponer una estructura a los datos. Por eso existen RPC y RMI.</p></div>

  <h2><span class="sn">8.2</span>Llamadas a procedimientos remotos (RPC)</h2>
  <p>Las RPC abstraen el mecanismo de llamada a procedimientos para usarlo entre <strong>sistemas conectados en red</strong>. Se implementan normalmente sobre el paso de mensajes, pero, a diferencia de IPC, los mensajes están <strong>bien estructurados</strong>: cada uno se dirige a un <strong>demonio RPC</strong> que escucha en un puerto y contiene el <strong>identificador de la función</strong> a ejecutar y sus <strong>parámetros</strong>. El resultado vuelve en un mensaje distinto.</p>
  <p>Un <strong>puerto</strong> es simplemente un número incluido al principio del paquete. Un sistema suele tener una dirección de red, pero muchos puertos para diferenciar los servicios que ofrece.</p>
  <h3>Stubs y empaquetado de parámetros</h3>
  <p>El cliente invoca el procedimiento remoto <strong>como si fuera local</strong>. El sistema RPC oculta los detalles con un <strong>stub</strong> en el lado del cliente (normalmente uno por procedimiento remoto): localiza el puerto del servidor y <strong>empaqueta los parámetros</strong> (<em>marshalling</em>) en un formato transmisible. Un stub equivalente en el servidor recibe el mensaje, desempaqueta e invoca el procedimiento. Los valores de retorno viajan de vuelta del mismo modo.</p>
  <div class="fig" data-d="seq-rpc">
    <div class="fig-head"><b>Ejecución de una llamada a procedimiento remoto</b><span>Paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="grid3">
    <div class="card mini"><div class="ico c">⇄</div><h4>Representación de datos</h4><p>Cliente y servidor pueden representar los enteros de forma distinta: <em>big-endian</em> (byte más significativo en la dirección menor) o <em>little-endian</em>. Muchos sistemas RPC definen una <strong>representación de datos externa (XDR)</strong> independiente de la máquina: el cliente convierte antes de enviar y el servidor reconvierte.</p></div>
    <div class="card mini"><div class="ico c">1</div><h4>Semántica de la llamada</h4><p>Por errores de red, una RPC puede fallar o ejecutarse más de una vez. «<strong>Como máximo una vez</strong>»: se asocia una marca temporal a cada mensaje y el servidor ignora los repetidos. «<strong>Exactamente una vez</strong>»: además, el servidor confirma con un mensaje <strong>ACK</strong> y el cliente reenvía periódicamente hasta recibirlo.</p></div>
    <div class="card mini"><div class="ico c">⚓</div><h4>Asociación de puertos</h4><p>El cliente debe conocer el puerto del servidor. Dos métodos: <strong>direcciones fijas</strong> decididas en compilación, o <strong>asociación dinámica</strong> mediante un demonio de <em>rendezvous</em> (<em>matchmaker</em>) en un puerto fijo.</p></div>
  </div>
  <div class="fig" data-d="seq-mm">
    <div class="fig-head"><b>Asociación dinámica con el demonio de rendezvous</b><span>Paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <p>El método dinámico añade una solicitud inicial, pero es más flexible que el de puertos fijos. Las RPC son muy útiles para implementar <strong>sistemas de archivos distribuidos</strong>: los mensajes se dirigen al puerto del sistema de archivos del servidor e indican la operación de disco (lectura, escritura, cambio de nombre, borrado o estado).</p>

  <h2><span class="sn">8.3</span>Invocación de métodos remotos (RMI)</h2>
  <p>RMI es una funcionalidad de <strong>Java</strong> similar a RPC: permite que una hebra invoque un método sobre un <strong>objeto remoto</strong>, es decir, un objeto que reside en una máquina virtual Java (JVM) diferente, en la misma computadora o en otra conectada por red. Se implementa con <strong>stubs</strong> (proxy del objeto remoto, en el cliente) y <strong>esqueletos</strong> (en el servidor).</p>
  <div class="fig" data-d="seq-rmi">
    <div class="fig-head"><b>Invocación <code style="background:transparent;color:#fff">servidor.algunMetodo(A, B)</code></b><span>Paso a paso</span></div>
    <div class="stage"></div><div class="stepbar"></div>
    <p class="caption" aria-live="polite"></p>
  </div>
  <div class="tw"><table>
    <thead><tr><th></th><th>RPC</th><th>RMI</th></tr></thead>
    <tbody>
      <tr><th>Paradigma</th><td>Programación <strong>procedimental</strong>: sólo se llama a procedimientos o funciones remotas.</td><td>Basado en <strong>objetos</strong>: se invocan métodos de objetos remotos.</td></tr>
      <tr><th>Parámetros</th><td>Estructuras de datos ordinarias.</td><td>Pueden pasarse <strong>objetos</strong> como parámetros.</td></tr>
    </tbody>
  </table></div>
  <h3>Reglas de paso de parámetros</h3>
  <ul>
    <li>Los objetos <strong>locales</strong> (no remotos) se pasan <strong>por copia</strong>, mediante <strong>serialización de objetos</strong>. Deben implementar la interfaz <code>java.io.Serializable</code>.</li>
    <li>Los objetos <strong>remotos</strong> se pasan <strong>por referencia</strong>, así el servidor puede invocar métodos sobre ellos de forma remota.</li>
  </ul>

  <div class="key"><h3>Ideas clave del módulo</h3>
    <ul>
      <li>Un socket es IP + puerto; sirve para flujos de bytes sin estructura.</li>
      <li>RPC oculta la red con stubs y empaquetado de parámetros; su semántica debe cuidar los duplicados.</li>
      <li>RMI es la versión orientada a objetos de RPC en Java y permite pasar objetos.</li>
    </ul>
  </div>
  <div class="pager"><button class="btn ghost" data-prev>Anterior: Ejemplos de IPC</button><button class="btn" data-next>Siguiente: Línea de tiempo</button></div>
</section>

<!-- =====================  10. RESUMEN  ===================== -->
<section class="page" id="p10" data-title="Resumen del capítulo" data-short="Resumen">
  <span class="kicker">Módulo 10. Sección 3.7 del libro</span>
  <h1 class="page-title">Resumen del capítulo</h1>
  <p class="lead">Un proceso es un programa en ejecución. Al ejecutarse cambia de estado, y el sistema operativo lo representa mediante su propio bloque de control de proceso (PCB).</p>
  <div class="grid2">
    <div class="card mini"><h4>Estados y colas</h4><p>Cada proceso está nuevo, preparado, en ejecución, en espera o terminado. Cuando no se ejecuta, está en una cola: de solicitudes de E/S o de procesos preparados. Los PCB se enlazan para formar la cola de preparados.</p></div>
    <div class="card mini"><h4>Planificación</h4><p>La planificación a largo plazo (de trabajos) selecciona los procesos que podrán competir por la CPU y depende mucho de la asignación de recursos, sobre todo de la memoria. La de corto plazo (CPU) elige un proceso de la cola de preparados.</p></div>
    <div class="card mini"><h4>Creación y terminación</h4><p>El sistema ofrece un mecanismo para que los padres creen hijos. El padre puede esperar a que terminen o ejecutarse concurrentemente. Razones para la concurrencia: compartir información, acelerar cálculos, modularidad y comodidad.</p></div>
    <div class="card mini"><h4>Cooperación</h4><p>Los procesos pueden ser independientes o cooperativos. Estos últimos necesitan comunicación interprocesos: memoria compartida o paso de mensajes. No son mutuamente excluyentes y pueden usarse a la vez.</p></div>
    <div class="card mini"><h4>Memoria compartida</h4><p>Los procesos comparten variables y se comunican a través de ellas. Es responsabilidad de los programadores de la aplicación; el sistema operativo sólo proporciona la memoria compartida.</p></div>
    <div class="card mini"><h4>Paso de mensajes</h4><p>Los procesos intercambian mensajes. La responsabilidad de ofrecer los mecanismos de comunicación recae en el propio sistema operativo.</p></div>
  </div>
  <div class="card" style="margin-top:6px"><h3>Cliente-servidor</h3><p>La comunicación puede basarse en <strong>sockets</strong> (punto terminal de comunicación; cada conexión es una pareja de sockets), en <strong>RPC</strong> (un proceso llama a un procedimiento de una aplicación remota) o en <strong>RMI</strong> (la versión Java de RPC: permite invocar un método sobre un objeto remoto). La diferencia principal entre RPC y RMI es que en RPC se pasan datos con una estructura ordinaria, mientras que en RMI se pueden pasar objetos.</p></div>
  <div class="key"><h3>Para llevarse</h3>
    <ul>
      <li>Proceso ≠ programa: el proceso es una entidad activa con contador de programa y recursos.</li>
      <li>El PCB guarda el contexto; el cambio de contexto lo guarda y restaura.</li>
      <li>La comunicación entre procesos se resuelve con memoria compartida o con mensajes, y entre computadoras con sockets, RPC o RMI.</li>
    </ul>
  </div>

</section>
